      properties:
        ID_TIPO:
          type: integer
          minimum: 1
        ID_UNIDAD:
          type: integer
          minimum: 1
      description: |
        `ES_SEMILLA`, `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
        El tipo de lote tiene que ser final.
    Lote:
      type: object
      required: [ID, ID_TIPO, PADRE_ID, ID_UNIDAD, USUARIO_ID, ID_ORIGEN_USUARIO, CREADO_EN, ACTUALIZADO_EN]

      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
        ID_TIPO:
          type: integer
          minimum: 1
          description: Referencia a `LOTES_TIPOS`.
        PADRE_ID:
          type: integer
          nullable: true
          minimum: 1
          description: Lote que lo contiene. Solo una categoría final puede tener padre, y ese padre no es final.
        ID_UNIDAD:
          type: integer
          nullable: true
          minimum: 1
          description: Unidad de transporte. Solo la puede llevar una categoría que no es final.
        USUARIO_ID:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Identificador del usuario. Con origen `1` apunta a `USUARIOS`.
            Con otro origen es una referencia externa.
        ID_ORIGEN_USUARIO:
          type: integer
          nullable: true
          minimum: 1
          description: Procedencia de `USUARIO_ID`. El valor `1` es interno.
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento en que se creó el registro. Lo asigna el servicio.
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento de la última modificación. Lo mueve el servicio en cada cambio.
    Expedicion:
      type: object
      required:
        - ID
        - ID_UNIDAD
        - FECHA_CIERRE
        - ID_UBICACION_SALIDA
        - CLAVE_UBICACION_SALIDA
        - USUARIO_ID
        - ID_ORIGEN_USUARIO
        - CREADO_EN
        - ACTUALIZADO_EN
      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
        ID_UNIDAD:
          type: integer
          minimum: 1
          description: Referencia a `UNIDADES_TRANSPORTE`.
        FECHA_CIERRE:
          type: string
          format: date-time
          nullable: true
          description: Nulo mientras la expedición está abierta. Debe ser posterior o igual a `CREADO_EN`.
        ID_UBICACION_SALIDA:
          type: integer
          nullable: true
          minimum: 1
          description: Identificador externo de la ubicación de salida.
        CLAVE_UBICACION_SALIDA:
          type: string
          nullable: true
          minLength: 1
          description: Clave externa de la ubicación de salida.
        USUARIO_ID:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Identificador del usuario. Con origen `1` apunta a `USUARIOS`.
            Con otro origen es una referencia externa.
        ID_ORIGEN_USUARIO:
          type: integer
          nullable: true
          minimum: 1
          description: Procedencia de `USUARIO_ID`. El valor `1` es interno.
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento en que se creó el registro. Lo asigna el servicio.
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento de la última modificación. Lo mueve el servicio en cada cambio.
    ExpedicionEntrada:
      type: object
      required: [ID_UNIDAD]
      properties:
        ID_UNIDAD:
          type: integer
          minimum: 1
        FECHA_CIERRE:
          type: string
          format: date-time
          nullable: true
        ID_UBICACION_SALIDA:
          type: integer
          nullable: true
          minimum: 1
        CLAVE_UBICACION_SALIDA:
          type: string
          nullable: true
          minLength: 1
        USUARIO_ID:
          type: integer
          nullable: true
          minimum: 1
        ID_ORIGEN_USUARIO:
          type: integer
          nullable: true
          minimum: 1
      description: |
        En el reemplazo, los opcionales omitidos se guardan como `null`.
        `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
    ExpedicionLote:
      type: object
      required:
        - ID
        - ID_EXPEDICION
        - ID_LOTE
        - EMBARCADO_EN
        - USUARIO_ID
        - ID_ORIGEN_USUARIO
        - CREADO_EN
        - ACTUALIZADO_EN
      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
        ID_EXPEDICION:
          type: integer
          minimum: 1
          description: Referencia a `EXPEDICIONES`.
        ID_LOTE:
          type: integer
          minimum: 1
          description: Referencia a `LOTES`. Debe ser suelto y no estar embarcado.
        EMBARCADO_EN:
          type: string
          format: date-time
          description: Momento del embarque. Por defecto `now()`.
        USUARIO_ID:
          type: integer
          nullable: true
          minimum: 1
        ID_ORIGEN_USUARIO:
          type: integer
          nullable: true
          minimum: 1
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
    ExpedicionLoteEntrada:
      type: object
      required: [ID_EXPEDICION, ID_LOTE]
      properties:
        ID_EXPEDICION:
          type: integer
          minimum: 1
        ID_LOTE:
          type: integer
          minimum: 1
        EMBARCADO_EN:
          type: string
          format: date-time
          nullable: true
        USUARIO_ID:
          type: integer
          nullable: true
          minimum: 1
        ID_ORIGEN_USUARIO:
          type: integer
          nullable: true
          minimum: 1
      description: |
        `EMBARCADO_EN` omitido o `null` usa el valor por defecto de la base.
        `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
    LoteEntrada:
      type: object
      required: [ID_TIPO]
      properties:
        ID_TIPO:
          type: integer
          minimum: 1
        PADRE_ID:
          type: integer
          nullable: true
          minimum: 1
        ID_UNIDAD:
          type: integer
          nullable: true
          minimum: 1
        USUARIO_ID:
          type: integer
          nullable: true
          minimum: 1
        ID_ORIGEN_USUARIO:
          type: integer
          nullable: true
          minimum: 1
      description: |
        En el reemplazo, `PADRE_ID` e `ID_UNIDAD` omitidos se guardan como `null`.
        `USUARIO_ID` e `ID_ORIGEN_USUARIO` van juntos: ambos null o ambos con valor.
        `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
    LoteReferencia:
      type: object
      required:
        - ID
        - ID_LOTE
        - ID_TIPO
        - REFERENCIA
        - DESCRIPCION
        - USUARIO_ID
        - ID_ORIGEN_USUARIO
        - CREADO_EN
        - ACTUALIZADO_EN
      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
        ID_LOTE:
          type: integer
          minimum: 1
          description: Referencia a `LOTES`.
        ID_TIPO:
          type: integer
          minimum: 1
          description: Referencia a `REFERENCIAS_TIPOS`.
        REFERENCIA:
          type: string
          minLength: 1
          description: Identificador externo. Se recortan los espacios.
        DESCRIPCION:
          type: string
          nullable: true
          minLength: 1
          description: Texto libre. Se recortan los espacios. Si se omite, queda `null`.
        USUARIO_ID:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Identificador del usuario. Con origen `1` apunta a `USUARIOS`.
            Con otro origen es una referencia externa.
        ID_ORIGEN_USUARIO:
          type: integer
          nullable: true
          minimum: 1
          description: Procedencia de `USUARIO_ID`. El valor `1` es interno.
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento en que se creó el registro. Lo asigna el servicio.
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento de la última modificación. Lo mueve el servicio en cada cambio.
    LoteReferenciaEntrada:
      type: object
      required: [ID_LOTE, ID_TIPO, REFERENCIA]
      properties:
        ID_LOTE:
          type: integer
          minimum: 1
        ID_TIPO:
          type: integer
          minimum: 1
        REFERENCIA:
          type: string
          minLength: 1
        DESCRIPCION:
          type: string
          nullable: true
          minLength: 1
        USUARIO_ID:
          type: integer
          nullable: true
          minimum: 1
        ID_ORIGEN_USUARIO:
          type: integer
          nullable: true
          minimum: 1
      description: |
        En el reemplazo, `DESCRIPCION` omitida se guarda como `null`.
        `USUARIO_ID` e `ID_ORIGEN_USUARIO` van juntos: ambos null o ambos con valor.
        `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
    LoteProducto:
      type: object
      required:
        - ID
        - ID_LOTE
        - CLAVE_PRODUCTO
        - CANTIDAD
        - ID_UNIDAD
        - CREADO_EN
        - ACTUALIZADO_EN
      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
          description: Identificador de la fila. Lo asigna la base como identity.
        ID_LOTE:
          type: integer
          minimum: 1
          description: Referencia a un `LOTES` de categoría final.
        CLAVE_PRODUCTO:
          type: string
          minLength: 1
          description: Clave externa del producto. Se recortan los espacios.
        CANTIDAD:
          type: number
          exclusiveMinimum: 0
          description: Cantidad medida. Si la unidad es entera, no puede llevar decimales.
        ID_UNIDAD:
          type: integer
          minimum: 1
          description: Unidad de medida permitida para el tipo del lote.
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
    LoteProductoEntrada:
      type: object
      required: [ID_LOTE, CLAVE_PRODUCTO, CANTIDAD, ID_UNIDAD]
      properties:
        ID_LOTE:
          type: integer
          minimum: 1
        CLAVE_PRODUCTO:
          type: string
          minLength: 1
        CANTIDAD:
          type: number
          exclusiveMinimum: 0
        ID_UNIDAD:
          type: integer
          minimum: 1
      description: |
        El producto externo se identifica por `CLAVE_PRODUCTO`.
        `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
    LoteTipo:
      type: object
      required: [ID, CODIGO, NOMBRE, ACTIVO, ES_SEMILLA, ES_FINAL, CREADO_EN, ACTUALIZADO_EN]
      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
        CODIGO:
          type: string
          minLength: 1
        NOMBRE:
          type: string
          minLength: 1
        ACTIVO:
          type: boolean
        ES_SEMILLA:
          type: boolean
          readOnly: true
          description: Caja, tambo y tarima nacen como semilla. Se pueden modificar y no se eliminan.
        ES_FINAL:
          type: boolean
          description: |
            `true` en caja y tambo, que contienen productos.
            `false` en tarima, que contiene lotes finales.
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento en que se creó el registro. Lo asigna el servicio.
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento de la última modificación. Lo mueve el servicio en cada cambio.
    LoteTipoEntrada:
      type: object
      required: [CODIGO, NOMBRE]
      properties:
        CODIGO:
          type: string
          minLength: 1
        NOMBRE:
          type: string
          minLength: 1
        ACTIVO:
          type: boolean
          default: true
        ES_FINAL:
          type: boolean
          default: false
      description: |
        `ES_SEMILLA`, `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
        Las unidades de medida de un tipo viven en `LOTES_TIPOS_UNIDADES`, no en este cuerpo.
    UnidadMedidaEntrada:
      type: object
      required: [CODIGO, NOMBRE]
      properties:
        CODIGO:
          type: string
          minLength: 1
          description: Se recortan los espacios. El valor resultante debe ser único.
        NOMBRE:
          type: string
          minLength: 1
          description: Se recortan los espacios.
        ACTIVO:
          type: boolean
          default: true
          description: Si se omite, el servicio guarda `true`.
        ENTERA:
          type: boolean
          default: false
          description: En el alta, si se omite, el servicio guarda `false`. En el reemplazo, si se omite, se conserva.
      description: '`ES_SEMILLA`, `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.'
    CatalogoEntrada:
      type: object
      required: [CODIGO, NOMBRE]
      properties:
        CODIGO:
          type: string
          minLength: 1
          description: Se recortan los espacios. El valor resultante debe ser único en el catálogo.
        NOMBRE:
          type: string
          minLength: 1
          description: Se recortan los espacios.
        ACTIVO:
          type: boolean
          default: true
          description: Si se omite, el servicio guarda `true`.
      description: |
        Los campos ajenos a este esquema se ignoran.
        `CREADO_EN` y `ACTUALIZADO_EN` los asigna el servicio.
    UnidadTransporte:
      type: object
      required:
        - ID
        - CODIGO
        - ID_TIPO
        - PLACAS
        - NUMERO_ECONOMICO
        - MARCA
        - MODELO
        - ANIO
        - NUMERO_SERIE
        - CAPACIDAD_CARGA_KG
        - CAPACIDAD_VOLUMEN_M3
        - ID_ESTATUS
        - ACTIVO
        - ES_SEMILLA
        - CREADO_EN
        - ACTUALIZADO_EN
      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
        CODIGO:
          type: string
          minLength: 1
        ID_TIPO:
          type: integer
          minimum: 1
          description: Referencia a `UNIDADES_TIPOS`.
        PLACAS:
          type: string
          minLength: 1
        NUMERO_ECONOMICO:
          type: string
          nullable: true
          minLength: 1
        MARCA:
          type: string
          nullable: true
          minLength: 1
        MODELO:
          type: string
          nullable: true
          minLength: 1
        ANIO:
          type: integer
          nullable: true
          minimum: 1980
          maximum: 2100
        NUMERO_SERIE:
          type: string
          nullable: true
          minLength: 1
        CAPACIDAD_CARGA_KG:
          type: number
          nullable: true
          minimum: 0
          description: La base la guarda como `numeric(12,2)`.
        CAPACIDAD_VOLUMEN_M3:
          type: number
          nullable: true
          minimum: 0
          description: La base la guarda como `numeric(12,2)`.
        ID_ESTATUS:
          type: integer
          minimum: 1
          description: Referencia a `UNIDADES_ESTATUS`.
        ACTIVO:
          type: boolean
        ES_SEMILLA:
          type: boolean
          readOnly: true
          description: |
            `true` si el registro nació en `seed.sql`.
            Ese registro se puede modificar y no se puede eliminar.
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
    UnidadTransporteEntrada:
      type: object
      required: [CODIGO, ID_TIPO, PLACAS, ID_ESTATUS]
      properties:
        CODIGO:
          type: string
          minLength: 1
          description: Se recortan los espacios. El valor resultante debe ser único.
        ID_TIPO:
          type: integer
          minimum: 1
        PLACAS:
          type: string
          minLength: 1
          description: Se recortan los espacios. El valor resultante debe ser único.
        NUMERO_ECONOMICO:
          type: string
          nullable: true
          minLength: 1
        MARCA:
          type: string
          nullable: true
          minLength: 1
        MODELO:
          type: string
          nullable: true
          minLength: 1
        ANIO:
          type: integer
          nullable: true
          minimum: 1980
          maximum: 2100
        NUMERO_SERIE:
          type: string
          nullable: true
          minLength: 1
        CAPACIDAD_CARGA_KG:
          type: number
          nullable: true
          minimum: 0
          maximum: 9999999999.99
        CAPACIDAD_VOLUMEN_M3:
          type: number
          nullable: true
          minimum: 0
          maximum: 9999999999.99
        ID_ESTATUS:
          type: integer
          minimum: 1
        ACTIVO:
          type: boolean
          default: true
          description: Si se omite, el servicio guarda `true`.
      description: |
        `ES_SEMILLA`, `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
        En el reemplazo, cada campo opcional omitido se guarda como `null`.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        path:
          type: string
          description: Presente solo cuando la ruta no existe.
