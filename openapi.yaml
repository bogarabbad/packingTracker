        ID_TIPO:
          type: integer
          minimum: 1
          description: |
            Referencia a `DISPOSITIVOS_TIPOS`.
            Tras enrollment suele ser la semilla `CODIGO = pendiente`.
        IDENTIFICADOR:
          type: string
          minLength: 1
          description: UUID estable del equipo en la app Android.
        NOMBRE:
          type: string
          nullable: true
          minLength: 1
          description: |
            Puede ser `null` en un dispositivo vacío (recién enrollado).
            El operador lo completa en la web.
        ACTIVO:
          type: boolean
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
    DispositivoEntrada:
      type: object
      required: [ID_TIPO]
      properties:
        ID_TIPO:
          type: integer
          minimum: 1
        NOMBRE:
          type: string
          nullable: true
          minLength: 1
          description: Opcional. Vacío o omitido se guarda como `null`.
        ACTIVO:
          type: boolean
          default: true
      description: |
        Solo actualización. El alta es exclusiva de `POST /enrollment`.
        `IDENTIFICADOR`, `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
    PrefijoEscaneoCodigo:
      type: string
      description: |
        Prefijo literal al inicio del string escaneado.
        Lista cerrada: solo los valores de este enum son válidos.
      enum:
        - PTENR|
    PrefijoEscaneoAccion:
      type: string
      description: Acción que la app Android debe ejecutar al reconocer el prefijo.
      enum:
        - enrollment
    PrefijoEscaneo:
      type: object
      required: [PREFIJO, ACCION, DESCRIPCION, FORMATO_PAYLOAD]
      additionalProperties: false
      properties:
        PREFIJO:
          $ref: '#/components/schemas/PrefijoEscaneoCodigo'
        ACCION:
          $ref: '#/components/schemas/PrefijoEscaneoAccion'
        DESCRIPCION:
          type: string
        FORMATO_PAYLOAD:
          type: string
          description: Plantilla del contenido escaneado (`{PREFIJO}` + carga).
      description: |
        Entrada del catálogo estático de prefijos.
        No se persiste en base de datos; API y Android deben coincidir.
    PrefijosEscaneo:
      type: array
      description: |
        Lista estática acordada API ↔ Android.
        Embebida en la app; no se consulta al servidor.
        Versión actual: solo enrollment.
      minItems: 1
      items:
        $ref: '#/components/schemas/PrefijoEscaneo'
      example:
        - PREFIJO: PTENR|
          ACCION: enrollment
          DESCRIPCION: |
            Enrollment de dispositivo. La carga tras el prefijo es
            `AUTORIZACION_TOKENS.TOKEN`. La app llama `POST /enrollment`
            con ese token (sin prefijo) y el `IDENTIFICADOR` del equipo.
          FORMATO_PAYLOAD: PTENR|{TOKEN}
    EnrollmentEntrada:
      type: object
      required: [TOKEN, IDENTIFICADOR]
      properties:
        TOKEN:
          type: string
          minLength: 1
          description: |
            `AUTORIZACION_TOKENS.TOKEN`, opcionalmente con prefijo `PTENR|`.
            El servicio elimina el prefijo de enrollment si está presente.
        IDENTIFICADOR:
          type: string
          minLength: 1
          description: UUID estable del equipo Android.
    Enrollment:
      type: object
      required: [DISPOSITIVO, TOKEN, CREADO]
      properties:
        DISPOSITIVO:
          $ref: '#/components/schemas/Dispositivo'
        TOKEN:
          $ref: '#/components/schemas/AutorizacionToken'
        CREADO:
          type: boolean
          description: `true` si se insertó un `DISPOSITIVOS` nuevo en esta petición.
    AutorizacionToken:
      type: object
      required:
        - ID
        - ID_DISPOSITIVO
        - TOKEN
        - NOMBRE
        - ACTIVO
        - EXPIRA_EN
        - ULTIMO_USO_EN
        - CREADO_EN
        - ACTUALIZADO_EN
      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
        ID_DISPOSITIVO:
          type: integer
          nullable: true
          minimum: 1
          description: Referencia a `DISPOSITIVOS`. Puede ser nulo.
        TOKEN:
          type: string
          minLength: 1
        NOMBRE:
          type: string
          minLength: 1
        ACTIVO:
          type: boolean
        EXPIRA_EN:
          type: string
          format: date-time
          nullable: true
        ULTIMO_USO_EN:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
    AutorizacionTokenEntrada:
      type: object
      required: [TOKEN, NOMBRE]
      properties:
        ID_DISPOSITIVO:
          type: integer
          nullable: true
          minimum: 1
        TOKEN:
          type: string
          minLength: 1
        NOMBRE:
          type: string
          minLength: 1
        ACTIVO:
          type: boolean
          default: true
        EXPIRA_EN:
          type: string
          format: date-time
          nullable: true
      description: |
        `ULTIMO_USO_EN`, `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
    RespuestaUbicacionCategoria:
