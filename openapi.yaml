            database:
              $ref: '#/components/schemas/Check'
    Check:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: "`ok` cuando el chequeo pasa. En la base, `error` cuando la conexión falla."
          enum: [ok, error]
    Catalogo:
      type: object
      required: [ID, CODIGO, NOMBRE, ACTIVO, ES_SEMILLA, CREADO_EN, ACTUALIZADO_EN]
      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
        CODIGO:
          type: string
          minLength: 1
        NOMBRE:
          type: string
          minLength: 1
        ACTIVO:
          type: boolean
        ES_SEMILLA:
          type: boolean
          readOnly: true
          description: |
            `true` si el registro nació en `init.sql` o `seed.sql`.
            Ese registro se puede modificar y no se puede eliminar.
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento en que se creó el registro. Lo asigna el servicio.
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento de la última modificación. Lo mueve el servicio en cada cambio.
    UnidadMedida:
      type: object
      required: [ID, CODIGO, NOMBRE, ACTIVO, ES_SEMILLA, ENTERA, CREADO_EN, ACTUALIZADO_EN]
      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
        CODIGO:
          type: string
          minLength: 1
        NOMBRE:
          type: string
          minLength: 1
        ACTIVO:
          type: boolean
        ES_SEMILLA:
          type: boolean
          readOnly: true
          description: Unidad, litro y kilo nacen como semilla. Se pueden modificar y no se eliminan.
        ENTERA:
          type: boolean
          description: |
            `true` cuando la cantidad del producto debe ser entera, como en la unidad.
            `false` en litro y kilo.
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento en que se creó el registro. Lo asigna el servicio.
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento de la última modificación. Lo mueve el servicio en cada cambio.
    LoteTipoUnidad:
      type: object
      required: [ID, ID_TIPO, ID_UNIDAD, ES_SEMILLA, CREADO_EN, ACTUALIZADO_EN]
      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
        ID_TIPO:
          type: integer
          minimum: 1
          description: Referencia a un `LOTES_TIPOS` final.
        ID_UNIDAD:
          type: integer
          minimum: 1
          description: Referencia a `UNIDADES`.
        ES_SEMILLA:
          type: boolean
          readOnly: true
          description: |
            `true` en las relaciones que nacen con caja y tambo.
            Se pueden modificar y no se eliminan.
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento en que se creó el registro. Lo asigna el servicio.
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento de la última modificación. Lo mueve el servicio en cada cambio.
