        '200':
          description: Lote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLote'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      tags: [Lotes]
      operationId: updateLote
      summary: Reemplaza un lote
      description: |
        Reemplaza `ID_TIPO`, `PADRE_ID`, `ID_UNIDAD`, `USUARIO_ID` e `ID_ORIGEN_USUARIO`.
        Si `PADRE_ID` o `ID_UNIDAD` no vienen, se guardan como `null`.
        `USUARIO_ID` e `ID_ORIGEN_USUARIO` van juntos: ambos null o ambos con valor.
        Una categoría final no lleva unidad de transporte y solo puede colgar de una categoría que no es final.
        Una categoría que no es final no tiene padre.
      requestBody:
        $ref: '#/components/requestBodies/Lote'
      responses:
        '200':
          description: Lote actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLote'
        '400':
          $ref: '#/components/responses/ErrorLote'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    delete:
      tags: [Lotes]
      operationId: deleteLote
      summary: Elimina un lote
      description: |
        También elimina los productos y las referencias de ese lote.
        Responde `409` si otro lote lo tiene como padre o si está embarcado en una expedición.
      responses:
        '200':
          $ref: '#/components/responses/Eliminado'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
