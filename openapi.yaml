  /autorizacion-tokens/{id}/qr:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Tokens de autorización]
      operationId: getAutorizacionTokenQr
      summary: Genera el QR de enrollment de un token
      description: |
        Devuelve un `DATA_URL` PNG cuyo payload es `PTENR|<TOKEN>`
        (prefijo estático de enrollment, ver `PrefijosEscaneo`).
        También incluye `PAYLOAD`, `PREFIJO`, `ACCION` y el `TOKEN` crudo.
        La app Android reconoce `PTENR|`, extrae el token y llama
        `POST /enrollment`. Requiere JWT (uso de la plataforma web).
      responses:
        '200':
          description: QR listo para mostrar en pantalla.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaAutorizacionTokenQr'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT o token de dispositivo
      description: |
        Dos credenciales válidas en `Authorization: Bearer <valor>`:

        1. JWT de usuario emitido por `POST /auth/login` (tres segmentos separados por `.`).
        2. Token de dispositivo: valor de `AUTORIZACION_TOKENS.TOKEN` tras enrollment.
           Requisitos: token activo, no vencido, con `ID_DISPOSITIVO` asignado,
           y dispositivo activo. Si falla: `invalid_token`, `token_inactive`,
           `token_expired`, `token_not_bound` o `dispositivo_inactive`.
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador entero positivo, sin ceros a la izquierda.
      schema:
        type: string
        pattern: '^[1-9]\d*$'
    Page:
      name: page
      in: query
      required: false
      description: Página, empezando en 1. Si se omite, el servicio usa 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Items:
      name: items
      in: query
      required: false
      description: Registros por página. Si se omite, el servicio usa 50.
      schema:
        type: integer
        minimum: 1
        default: 50
    IdTipo:
      name: id_tipo
      in: query
      required: false
      description: Filtra por identificador de tipo de lote. Entero positivo sin ceros a la izquierda.
      schema:
        type: string
        pattern: '^[1-9]\d*$'
    IdLote:
      name: id_lote
      in: query
      required: false
      description: Filtra por identificador de lote. Entero positivo sin ceros a la izquierda.
      schema:
        type: string
        pattern: '^[1-9]\d*$'
    PadreId:
      name: padre_id
      in: query
      required: false
      description: Filtra lotes hijos por identificador del lote padre. Entero positivo sin ceros a la izquierda.
      schema:
        type: string
        pattern: '^[1-9]\d*$'
    PadreIdArbol:
      name: padre_id
      in: query
      required: false
      description: |
        Filtra por padre. Entero positivo, o `raiz` para filas con `PADRE_ID` nulo.
      schema:
        type: string
    IdCategoria:
      name: id_categoria
      in: query
      required: false
      description: Filtra por categoría de ubicación. Entero positivo sin ceros a la izquierda.
      schema:
        type: string
        pattern: '^[1-9]\d*$'
    IdTipoDispositivo:
      name: id_tipo
      in: query
      required: false
      description: Filtra por tipo de dispositivo. Entero positivo sin ceros a la izquierda.
      schema:
        type: string
        pattern: '^[1-9]\d*$'
    IdDispositivo:
      name: id_dispositivo
      in: query
      required: false
      description: Filtra por dispositivo. Entero positivo sin ceros a la izquierda.
      schema:
        type: string
        pattern: '^[1-9]\d*$'
    TieneEscaner:
      name: tiene_escaner
      in: query
      required: false
      description: Filtra por `TIENE_ESCANER`. `true`/`1` o `false`/`0`.
      schema:
        type: string
        enum: ['true', 'false', '1', '0']
    UbicacionId:
      name: ubicacion_id
      in: query
      required: false
      description: Filtra por `UBICACION_ID`. Entero positivo sin ceros a la izquierda.
      schema:
        type: string
        pattern: '^[1-9]\d*$'
    IdRecepcion:
      name: id_recepcion
      in: query
      required: false
      description: Filtra por recepción. Entero positivo sin ceros a la izquierda.
      schema:
        type: string
        pattern: '^[1-9]\d*$'
    IdUnidad:
      name: id_unidad
      in: query
      required: false
      description: Filtra por identificador de unidad de transporte. Entero positivo sin ceros a la izquierda.
      schema:
        type: string
        pattern: '^[1-9]\d*$'
    Abierta:
      name: abierta
      in: query
      required: false
      description: |
        Filtra por estado. `true` o `1` = sin `FECHA_CIERRE`.
        `false` o `0` = con `FECHA_CIERRE`.
      schema:
        type: string
        enum: ['true', 'false', '1', '0']
    Q:
      name: q
      in: query
      required: false
      description: Texto libre para buscar. Máximo 100 caracteres.
      schema:
        type: string
        maxLength: 100
    Activo:
      name: activo
      in: query
      required: false
      description: Filtra por `ACTIVO`. `true`/`1` o `false`/`0`.
      schema:
        type: string
        enum: ['true', 'false', '1', '0']
    EsFinal:
      name: es_final
      in: query
      required: false
      description: Filtra por `ES_FINAL`. `true`/`1` o `false`/`0`.
      schema:
        type: string
        enum: ['true', 'false', '1', '0']
    Entera:
      name: entera
      in: query
      required: false
      description: Filtra por `ENTERA`. `true`/`1` o `false`/`0`.
      schema:
        type: string
        enum: ['true', 'false', '1', '0']
    Embarcable:
      name: embarcable
      in: query
      required: false
      description: |
        `true`/`1` = sin `PADRE_ID` y aún no embarcado en ninguna expedición.
        `false`/`0` = con padre o ya embarcado.
      schema:
        type: string
        enum: ['true', 'false', '1', '0']
    IdExpedicion:
      name: id_expedicion
      in: query
      required: false
      description: Filtra por identificador de expedición. Entero positivo sin ceros a la izquierda.
      schema:
        type: string
        pattern: '^[1-9]\d*$'
    IdEstatus:
      name: id_estatus
      in: query
      required: false
      description: Filtra por identificador de estatus. Entero positivo sin ceros a la izquierda.
      schema:
        type: string
        pattern: '^[1-9]\d*$'
  requestBodies:
    ReferenciaTipo:
      required: true
      description: |
        En el alta, `CLAVE` es obligatoria.
        En el reemplazo, `CLAVE` omitida conserva su valor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReferenciaTipoEntrada'
          example:
            CODIGO: PACKING
            CLAVE: P
            NOMBRE: Packing
            ACTIVO: true
    LoteTipo:
      required: true
      description: |
        En el alta, `ES_FINAL` omitido se guarda como `false`.
        En el reemplazo, `ES_FINAL` omitido conserva su valor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoteTipoEntrada'
          example:
            CODIGO: tambo
            NOMBRE: Tambo
            ACTIVO: true
            ES_FINAL: true
    UnidadMedida:
      required: true
      description: |
        En el alta, `ENTERA` omitido se guarda como `false`.
        En el reemplazo, `ENTERA` omitido conserva su valor.
        `ES_SEMILLA`, `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnidadMedidaEntrada'
          example:
            CODIGO: gramo
            NOMBRE: Gramo
            ACTIVO: true
            ENTERA: false
    LoteTipoUnidad:
      required: true
      description: '`ES_SEMILLA`, `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoteTipoUnidadEntrada'
          example:
            ID_TIPO: 1
            ID_UNIDAD: 1
    Lote:
      required: true
      description: |
        `PADRE_ID`, `ID_UNIDAD`, `USUARIO_ID` e `ID_ORIGEN_USUARIO` se pueden omitir.
        `USUARIO_ID` e `ID_ORIGEN_USUARIO` van juntos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoteEntrada'
          example:
            ID_TIPO: 1
            PADRE_ID: null
            ID_UNIDAD: null
            USUARIO_ID: null
            ID_ORIGEN_USUARIO: null
    Expedicion:
      required: true
      description: |
        `FECHA_CIERRE`, `ID_UBICACION_SALIDA`, `UBICACION_SALIDA_ID`,
        `USUARIO_ID` e `ID_ORIGEN_USUARIO` se pueden omitir.
        `USUARIO_ID` e `ID_ORIGEN_USUARIO` van juntos.
        `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExpedicionEntrada'
          example:
            ID_UNIDAD: 1
            FECHA_CIERRE: null
            ID_UBICACION_SALIDA: null
            UBICACION_SALIDA_ID: null
            USUARIO_ID: 1
            ID_ORIGEN_USUARIO: 1
    ExpedicionLote:
      required: true
      description: |
        `EMBARCADO_EN` omitido usa `now()`.
        `USUARIO_ID` e `ID_ORIGEN_USUARIO` van juntos.
        `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExpedicionLoteEntrada'
          example:
            ID_EXPEDICION: 1
            ID_LOTE: 1
            EMBARCADO_EN: null
            USUARIO_ID: 1
            ID_ORIGEN_USUARIO: 1
    LoteReferencia:
      required: true
      description: |
        `DESCRIPCION`, `USUARIO_ID` e `ID_ORIGEN_USUARIO` se pueden omitir.
        `USUARIO_ID` e `ID_ORIGEN_USUARIO` van juntos.
        `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoteReferenciaEntrada'
          example:
            ID_LOTE: 1
            ID_TIPO: 1
            REFERENCIA: PL-100
            DESCRIPCION: Packing list de salida
    LoteProducto:
      required: true
      description: |
        El producto externo se identifica por `CLAVE_PRODUCTO`.
        `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoteProductoEntrada'
          example:
            ID_LOTE: 1
            CLAVE_PRODUCTO: SKU-100
            CANTIDAD: 12
            ID_UNIDAD: 1
    Catalogo:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CatalogoEntrada'
          example:
            CODIGO: disponible
            NOMBRE: Disponible
            ACTIVO: true
    UnidadTransporte:
      required: true
      description: |
        `ES_SEMILLA`, `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
        Un texto opcional vacío no es válido. Omitirlo guarda `null`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnidadTransporteEntrada'
          example:
            CODIGO: UT-010
            ID_TIPO: 1
            PLACAS: 84AB3C9
            NUMERO_ECONOMICO: ECO-10
            MARCA: Kenworth
            MODELO: T680
            ANIO: 2024
            NUMERO_SERIE: 1XKYDP9X5NJ123010
            CAPACIDAD_CARGA_KG: 20000
            CAPACIDAD_VOLUMEN_M3: 80
            ID_ESTATUS: 1
            ACTIVO: true
    UbicacionCategoria:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UbicacionCategoriaEntrada'
          example:
            PADRE_ID: null
            CODIGO: nave
            NOMBRE: Nave
            ACTIVO: true
    DispositivoTipo:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DispositivoTipoEntrada'
          example:
            CODIGO: honeywell-ck65
            NOMBRE: Honeywell CK65
            MARCA: Honeywell
            MODELO: CK65
            SISTEMA_OPERATIVO: Android
            VERSION_SO_MINIMA: '8.0'
            NUMERO_PARTE: CK65-L0N-50C1A0G
            TIENE_ESCANER: true
            DESCRIPCION: Computadora móvil de almacén
            ACTIVO: true
    Dispositivo:
      required: true
      description: |
        Cuerpo de actualización. No crea dispositivos (solo `POST /enrollment`).
        `IDENTIFICADOR`, `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DispositivoEntrada'
          example:
            ID_TIPO: 1
            NOMBRE: CK65 muelle 3
            ACTIVO: true
    AutorizacionToken:
      required: true
      description: |
        `ULTIMO_USO_EN`, `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AutorizacionTokenEntrada'
          example:
            ID_DISPOSITIVO: 1
            TOKEN: pkt_live_ejemplo
            NOMBRE: Token CK65 muelle 3
            ACTIVO: true
            EXPIRA_EN: null
    Ubicacion:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UbicacionEntrada'
          example:
            ID_CATEGORIA: 1
            PADRE_ID: null
            CODIGO: PLANTA
            NOMBRE: Planta
            ACTIVO: true
    LoteUbicacion:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoteUbicacionEntrada'
          example:
            ID_LOTE: 1
            UBICACION_ID: 1
            ID_TIPO: 2
            USUARIO_ID: 1
            ID_ORIGEN_USUARIO: 1
    Recepcion:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecepcionEntrada'
          example:
            ID_EXPEDICION: 1
            UBICACION_ID: 1
            USUARIO_ID: 1
            ID_ORIGEN_USUARIO: 1
    RecepcionLote:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecepcionLoteEntrada'
          example:
            ID_RECEPCION: 1
            ID_LOTE: 1
            OBSERVACIONES: null
            USUARIO_ID: 1
            ID_ORIGEN_USUARIO: 1
  responses:
    NoAutorizado:
      description: |
        Falta el Bearer, el token no es válido o ya caducó.
        `error.error` puede ser `unauthorized`, `invalid_token` o `token_expired`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            missing:
              value:
                data: null
                _metadata: {}
                error:
                  error: unauthorized
            expired:
              value:
                data: null
                _metadata: {}
                error:
                  error: token_expired
    CatalogoLista:
      description: Catálogo ordenado por `CREADO_EN` descendente, recortado a la página pedida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaCatalogoLista'
    PaginacionInvalida:
      description: |
        `page` o `items` no es un entero positivo.
        `error.error` puede ser `invalid_page` o `invalid_items`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            page:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_page
            items:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_items
    Catalogo:
      description: Registro del catálogo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaCatalogo'
    CatalogoCreado:
      description: Registro creado. El `ID` lo asigna la base de datos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaCatalogo'
    Eliminado:
      description: Registro eliminado. `data` y `error` son `null`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaVacia'
          example:
            data: null
            _metadata: {}
            error: null
    IdInvalido:
      description: El identificador no es un entero positivo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          example:
            data: null
            _metadata: {}
            error:
              error: invalid_id
    NoEncontrado:
      description: No existe un registro con ese identificador.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          example:
            data: null
            _metadata: {}
            error:
              error: not_found
    ErrorSolicitud:
      description: |
        El cuerpo no es válido. `error.error` puede ser `invalid_body`, `invalid_codigo`,
        `invalid_nombre`, `invalid_activo` o `request_error` cuando el JSON no se puede leer.
        `CODIGO` y `NOMBRE` deben ser texto no vacío después de recortar espacios.
        `ACTIVO`, si se envía, debe ser booleano.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            codigo:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_codigo
            nombre:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_nombre
            activo:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_activo
            cuerpo:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_body
    CodigoDuplicado:
      description: Ya existe un registro con el mismo `CODIGO`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          example:
            data: null
            _metadata: {}
            error:
              error: duplicate_codigo
    ConflictoEliminacion:
      description: |
        `seed_not_deletable` cuando el registro es semilla: se puede modificar, no eliminar.
        `record_in_use` cuando otra fila todavía referencia el registro.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            semilla:
              value:
                data: null
                _metadata: {}
                error:
                  error: seed_not_deletable
            en_uso:
              value:
                data: null
                _metadata: {}
                error:
                  error: record_in_use
    ErrorReferenciaTipo:
      description: |
        El cuerpo no es válido. `error.error` puede ser `invalid_body`, `invalid_codigo`,
        `invalid_clave`, `invalid_nombre`, `invalid_activo` o `request_error`.
        `CLAVE` debe ser texto no vacío de hasta 8 caracteres después de recortar espacios.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            clave:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_clave
            codigo:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_codigo
    ConflictoReferenciaTipo:
      description: |
        `duplicate_codigo` si el código ya existe.
        `duplicate_clave` si la clave ya existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            codigo:
              value:
                data: null
                _metadata: {}
                error:
                  error: duplicate_codigo
            clave:
              value:
                data: null
                _metadata: {}
                error:
                  error: duplicate_clave
    ErrorLoteTipo:
      description: |
        El cuerpo no es válido o el cambio de `ES_FINAL` deja el tipo inconsistente
        con sus lotes, productos o unidades de medida.
        `invalid_es_final` cuando `ES_FINAL` no es booleano.
        `invalid_tipo_lote` cuando la base rechaza el cambio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            final:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_es_final
            tipo:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_tipo_lote
    ErrorLoteProducto:
      description: |
        El cuerpo no es válido, el lote no es final, la unidad no corresponde al tipo
        o la cantidad no cumple la unidad entera.
        `error.error` puede ser `invalid_body`, `invalid_id_lote`, `invalid_clave_producto`,
        `invalid_cantidad`, `invalid_id_unidad`, `invalid_tipo_lote` o `invalid_producto`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            cantidad:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_cantidad
            unidad:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_id_unidad
    ErrorLoteReferencia:
      description: |
        El cuerpo no es válido, el lote o el tipo no existen, o la referencia queda vacía.
        `error.error` puede ser `invalid_body`, `invalid_id_lote`, `invalid_id_tipo`,
        `invalid_referencia`, `invalid_descripcion`, `invalid_usuario_id`,
        `invalid_id_origen_usuario` o `invalid_usuario_origen`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            lote:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_id_lote
            referencia:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_referencia
            descripcion:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_descripcion
    ErrorLote:
      description: |
        El cuerpo no cumple la jerarquía del lote.
        `error.error` puede ser `invalid_body`, `invalid_id_tipo`, `invalid_padre_id`,
        `invalid_id_unidad`, `invalid_usuario_id`, `invalid_id_origen_usuario`,
        `invalid_usuario_origen`, `invalid_tipo_lote` o `invalid_lote`.
        `invalid_id_unidad` también responde cuando una categoría final trae unidad de transporte
        o cuando esa unidad no existe.
        `invalid_padre_id` también responde si el lote ya está embarcado y se le asigna padre.
        `invalid_lote` responde cuando una categoría final intenta contener otro lote.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            padre:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_padre_id
            unidad:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_id_unidad
            usuario:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_usuario_id
    LoteEnUso:
      description: Otro lote lo tiene como padre o el lote está embarcado en una expedición.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          example:
            data: null
            _metadata: {}
            error:
              error: record_in_use
    ErrorExpedicion:
      description: |
        El cuerpo no cumple las reglas de la expedición.
        `error.error` puede ser `invalid_body`, `invalid_id_unidad`, `invalid_fecha_cierre`,
        `invalid_id_ubicacion_salida`, `invalid_ubicacion_salida_id`,
        `invalid_usuario_id`, `invalid_id_origen_usuario`, `invalid_usuario_origen`
        o `invalid_expedicion`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            unidad:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_id_unidad
            cierre:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_fecha_cierre
    UnidadExpedicionAbierta:
      description: La unidad de transporte ya tiene una expedición abierta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          example:
            data: null
            _metadata: {}
            error:
              error: unidad_ya_abierta
    ExpedicionEnUso:
      description: La expedición tiene lotes embarcados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          example:
            data: null
            _metadata: {}
            error:
              error: record_in_use
    ErrorEmbarque:
      description: |
        El cuerpo no cumple las reglas del embarque.
        `error.error` puede ser `invalid_body`, `invalid_id_expedicion`, `invalid_id_lote`,
        `invalid_embarcado_en`, `invalid_usuario_id`, `invalid_id_origen_usuario`,
        `invalid_usuario_origen` o `invalid_embarque`.
        `invalid_id_lote` también responde si el lote tiene padre.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            lote:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_id_lote
            expedicion:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_id_expedicion
    ConflictoEmbarque:
      description: |
        `lote_ya_embarcado` si el lote ya está en otra expedición.
        `expedicion_cerrada` si la expedición ya tiene `FECHA_CIERRE`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            lote:
              value:
                data: null
                _metadata: {}
                error:
                  error: lote_ya_embarcado
            cerrada:
              value:
                data: null
                _metadata: {}
                error:
                  error: expedicion_cerrada
    ExpedicionCerrada:
      description: La expedición está cerrada y conserva sus lotes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          example:
            data: null
            _metadata: {}
            error:
              error: expedicion_cerrada
    ErrorRelacionLote:
      description: |
        El cuerpo no es válido, el tipo o la unidad no existen, o el tipo no es final.
        `error.error` puede ser `invalid_body`, `invalid_id_tipo`, `invalid_id_unidad` o `invalid_tipo_lote`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            tipo:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_tipo_lote
            unidad:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_id_unidad
    RelacionDuplicada:
      description: Ese tipo de lote ya tiene relacionada esa unidad de medida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          example:
            data: null
            _metadata: {}
            error:
              error: duplicate_relacion
    RelacionEnUso:
      description: |
        `duplicate_relacion` cuando el tipo ya tiene esa unidad.
        `record_in_use` cuando el par que se reemplaza todavía mide productos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            duplicada:
              value:
                data: null
                _metadata: {}
                error:
                  error: duplicate_relacion
            en_uso:
              value:
                data: null
                _metadata: {}
                error:
                  error: record_in_use
    ErrorUnidadMedida:
      description: |
        El cuerpo no es válido o el cambio de `ENTERA` deja cantidades fraccionarias en productos de esa unidad.
        `error.error` puede ser `invalid_body`, `invalid_codigo`, `invalid_nombre`, `invalid_activo` o `invalid_entera`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            entera:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_entera
            codigo:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_codigo
    ErrorUnidad:
      description: |
        El cuerpo no es válido o el tipo, el estatus o un límite de la unidad no se cumplen.
        `invalid_id_tipo` e `invalid_id_estatus` también responden cuando ese catálogo no existe.
        `invalid_anio` cuando el año no está entre 1980 y 2100.
        Las capacidades, si vienen, son números mayores o iguales a cero y de hasta `9999999999.99`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            placas:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_placas
            tipo:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_id_tipo
            anio:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_anio
    UnidadDuplicada:
      description: |
        Ya existe otra unidad con el mismo valor.
        `error.error` puede ser `duplicate_codigo`, `duplicate_placas`,
        `duplicate_numero_economico` o `duplicate_numero_serie`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            codigo:
              value:
                data: null
                _metadata: {}
                error:
                  error: duplicate_codigo
            placas:
              value:
                data: null
                _metadata: {}
                error:
                  error: duplicate_placas
    ErrorUbicacionCategoria:
      description: |
        Cuerpo inválido, padre inexistente o ciclo en el árbol.
        `error.error` puede ser `invalid_body`, `invalid_codigo`, `invalid_nombre`,
        `invalid_activo`, `invalid_padre_id` o `ciclo_padre`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
    ErrorUbicacion:
      description: |
        Cuerpo inválido, categoría o padre inexistente, o ciclo en el árbol.
        `error.error` puede ser `invalid_body`, `invalid_codigo`, `invalid_nombre`,
        `invalid_activo`, `invalid_id_categoria`, `invalid_padre_id` o `ciclo_padre`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
    ErrorLoteUbicacion:
      description: |
        El lote, la ubicación, el tipo o el usuario no son válidos.
        `error.error` puede ser `invalid_body`, `invalid_id_lote`, `invalid_ubicacion_id`,
        `invalid_id_tipo`, `invalid_usuario_id`, `invalid_id_origen_usuario`
        o `invalid_usuario_origen`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
    ErrorRecepcion:
      description: |
        La expedición, la ubicación o el usuario no son válidos.
        `error.error` puede ser `invalid_body`, `invalid_id_expedicion`,
        `invalid_ubicacion_id`, `invalid_usuario_id`, `invalid_id_origen_usuario`,
        `invalid_usuario_origen` o `invalid_recepcion`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
    ErrorRecepcionLote:
      description: |
        El lote no se puede recibir.
        `sin_destino` si no tiene DESTINO.
        `destino_no_coincide` si el DESTINO no es la ubicación de la recepción.
        `invalid_id_lote` si el lote tiene padre o no existe.
        `invalid_observaciones` si el texto queda vacío.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
    ErrorDispositivoTipo:
      description: |
        El cuerpo no es válido. `error.error` puede ser `invalid_body`, `invalid_codigo`,
        `invalid_nombre`, `invalid_marca`, `invalid_modelo`, `invalid_sistema_operativo`,
        `invalid_version_so_minima`, `invalid_numero_parte`, `invalid_tiene_escaner`,
        `invalid_descripcion`, `invalid_activo` o `invalid_dispositivo_tipo`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
    ErrorDispositivo:
      description: |
        El cuerpo no es válido. `error.error` puede ser `invalid_body`, `invalid_id_tipo`,
        `invalid_nombre`, `invalid_activo` o `invalid_dispositivo`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
    ErrorAutorizacionToken:
      description: |
        El cuerpo no es válido. `error.error` puede ser `invalid_body`, `invalid_id_dispositivo`,
        `invalid_token`, `invalid_nombre`, `invalid_activo`, `invalid_expira_en`
        o `invalid_autorizacion_token`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
    ConflictoAutorizacionToken:
      description: `duplicate_token` si el token ya existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          example:
            data: null
            _metadata: {}
            error:
              error: duplicate_token
    ErrorInterno:
      description: Fallo no controlado del servicio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          example:
            data: null
            _metadata: {}
            error:
              error: internal_error
  schemas:
    LoginEntrada:
      type: object
      required: [CODIGO, CONTRASENA]
      properties:
        CODIGO:
          type: string
          minLength: 1
          description: Código del usuario en `USUARIOS`.
        CONTRASENA:
          type: string
          minLength: 1
          format: password
    Login:
      type: object
      required: [access_token, token_type, expires_in, usuario]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          minimum: 1
          description: Segundos de vigencia del token.
        usuario:
          type: object
          required: [ID, CODIGO, NOMBRE]
          properties:
            ID:
              type: integer
              minimum: 1
            CODIGO:
              type: string
            NOMBRE:
              type: string
    RespuestaLogin:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Login'
    Metadata:
      description: |
        Vacío cuando la respuesta no es una lista.
        En un GET de lista contiene la paginación aplicada.
      oneOf:
        - $ref: '#/components/schemas/MetadataVacia'
        - $ref: '#/components/schemas/MetadataPaginacion'
    MetadataVacia:
      type: object
      additionalProperties: false
    MetadataPaginacion:
      type: object
      additionalProperties: false
      required: [page, items, total, pages]
      properties:
        page:
          type: integer
          minimum: 1
          description: Página devuelta. El valor por defecto es 1.
        items:
          type: integer
          minimum: 1
          description: Registros pedidos por página. El valor por defecto es 50.
        total:
          type: integer
          minimum: 0
          description: Registros de la consulta, sin recortar por página.
        pages:
          type: integer
          minimum: 0
          description: Páginas que cubren `total` con el `items` usado. Cero cuando no hay registros.
    Sobre:
      type: object
      required: [data, _metadata, error]
      properties:
        data:
          nullable: true
          description: |
            Objeto o lista con el resultado.
            `null` cuando la respuesta es un error o una eliminación.
        _metadata:
          $ref: '#/components/schemas/Metadata'
        error:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Error'
          description: "`null` cuando la petición tiene éxito."
    RespuestaHealth:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Health'
    RespuestaCatalogo:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Catalogo'
    RespuestaCatalogoLista:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Catalogo'
            _metadata:
              $ref: '#/components/schemas/MetadataPaginacion'
    RespuestaLoteTipo:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LoteTipo'
    RespuestaReferenciaTipo:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ReferenciaTipo'
    RespuestaReferenciaTipoLista:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ReferenciaTipo'
            _metadata:
              $ref: '#/components/schemas/MetadataPaginacion'
    RespuestaLote:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Lote'
    RespuestaExpedicion:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Expedicion'
    RespuestaExpedicionLista:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Expedicion'
            _metadata:
              $ref: '#/components/schemas/MetadataPaginacion'
    RespuestaExpedicionCarga:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ExpedicionCarga'
    RespuestaExpedicionLote:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ExpedicionLote'
    RespuestaExpedicionLoteLista:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ExpedicionLote'
            _metadata:
              $ref: '#/components/schemas/MetadataPaginacion'
    RespuestaLoteReferencia:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LoteReferencia'
    RespuestaLoteReferenciaLista:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/LoteReferencia'
            _metadata:
              $ref: '#/components/schemas/MetadataPaginacion'
    RespuestaLoteProducto:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LoteProducto'
    RespuestaLoteProductoLista:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/LoteProducto'
            _metadata:
              $ref: '#/components/schemas/MetadataPaginacion'
    RespuestaLoteLista:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Lote'
            _metadata:
              $ref: '#/components/schemas/MetadataPaginacion'
    RespuestaLoteTipoUnidad:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LoteTipoUnidad'
    RespuestaLoteTipoUnidadLista:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/LoteTipoUnidad'
            _metadata:
              $ref: '#/components/schemas/MetadataPaginacion'
    RespuestaUnidadMedida:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UnidadMedida'
    RespuestaUnidadMedidaLista:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/UnidadMedida'
            _metadata:
              $ref: '#/components/schemas/MetadataPaginacion'
    RespuestaLoteTipoLista:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/LoteTipo'
            _metadata:
              $ref: '#/components/schemas/MetadataPaginacion'
    RespuestaUnidadTransporte:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UnidadTransporte'
    RespuestaUnidadTransporteLista:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/UnidadTransporte'
            _metadata:
              $ref: '#/components/schemas/MetadataPaginacion'
    RespuestaVacia:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              nullable: true
            error:
              nullable: true
    RespuestaError:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              nullable: true
            error:
              $ref: '#/components/schemas/Error'
    Health:
      type: object
      required: [status, service, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          example: packing-tracker
        checks:
          type: object
          required: [api, database]
          properties:
            api:
              $ref: '#/components/schemas/Check'
            database:
              $ref: '#/components/schemas/Check'
    Check:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: "`ok` cuando el chequeo pasa. En la base, `error` cuando la conexión falla."
          enum: [ok, error]
    Catalogo:
      type: object
      required: [ID, CODIGO, NOMBRE, ACTIVO, ES_SEMILLA, CREADO_EN, ACTUALIZADO_EN]
      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
        CODIGO:
          type: string
          minLength: 1
        NOMBRE:
          type: string
          minLength: 1
        ACTIVO:
          type: boolean
        ES_SEMILLA:
          type: boolean
          readOnly: true
          description: |
            `true` si el registro nació en `init.sql` o `seed.sql`.
            Ese registro se puede modificar y no se puede eliminar.
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento en que se creó el registro. Lo asigna el servicio.
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento de la última modificación. Lo mueve el servicio en cada cambio.
    UnidadMedida:
      type: object
      required: [ID, CODIGO, NOMBRE, ACTIVO, ES_SEMILLA, ENTERA, CREADO_EN, ACTUALIZADO_EN]
      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
        CODIGO:
          type: string
          minLength: 1
        NOMBRE:
          type: string
          minLength: 1
        ACTIVO:
          type: boolean
        ES_SEMILLA:
          type: boolean
          readOnly: true
          description: Unidad, litro y kilo nacen como semilla. Se pueden modificar y no se eliminan.
        ENTERA:
          type: boolean
          description: |
            `true` cuando la cantidad del producto debe ser entera, como en la unidad.
            `false` en litro y kilo.
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento en que se creó el registro. Lo asigna el servicio.
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento de la última modificación. Lo mueve el servicio en cada cambio.
    LoteTipoUnidad:
      type: object
      required: [ID, ID_TIPO, ID_UNIDAD, ES_SEMILLA, CREADO_EN, ACTUALIZADO_EN]
      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
        ID_TIPO:
          type: integer
          minimum: 1
          description: Referencia a un `LOTES_TIPOS` final.
        ID_UNIDAD:
          type: integer
          minimum: 1
          description: Referencia a `UNIDADES`.
        ES_SEMILLA:
          type: boolean
          readOnly: true
          description: |
            `true` en las relaciones que nacen con caja y tambo.
            Se pueden modificar y no se eliminan.
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento en que se creó el registro. Lo asigna el servicio.
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento de la última modificación. Lo mueve el servicio en cada cambio.
    LoteTipoUnidadEntrada:
      type: object
      required: [ID_TIPO, ID_UNIDAD]
      properties:
        ID_TIPO:
          type: integer
          minimum: 1
        ID_UNIDAD:
          type: integer
          minimum: 1
      description: |
        `ES_SEMILLA`, `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
        El tipo de lote tiene que ser final.
    Lote:
      type: object
      required: [ID, ID_TIPO, PADRE_ID, ID_UNIDAD, USUARIO_ID, ID_ORIGEN_USUARIO, CREADO_EN, ACTUALIZADO_EN]

      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
        ID_TIPO:
          type: integer
          minimum: 1
          description: Referencia a `LOTES_TIPOS`.
        PADRE_ID:
          type: integer
          nullable: true
          minimum: 1
          description: Lote que lo contiene. Solo una categoría final puede tener padre, y ese padre no es final.
        ID_UNIDAD:
          type: integer
          nullable: true
          minimum: 1
          description: Unidad de transporte. Solo la puede llevar una categoría que no es final.
        USUARIO_ID:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Identificador del usuario. Con origen `1` apunta a `USUARIOS`.
            Con otro origen es una referencia externa.
        ID_ORIGEN_USUARIO:
          type: integer
          nullable: true
          minimum: 1
          description: Procedencia de `USUARIO_ID`. El valor `1` es interno.
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento en que se creó el registro. Lo asigna el servicio.
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento de la última modificación. Lo mueve el servicio en cada cambio.
    Expedicion:
      type: object
      required:
        - ID
        - ID_UNIDAD
        - FECHA_CIERRE
        - ID_UBICACION_SALIDA
        - UBICACION_SALIDA_ID
        - USUARIO_ID
        - ID_ORIGEN_USUARIO
        - CREADO_EN
        - ACTUALIZADO_EN
      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
        ID_UNIDAD:
          type: integer
          minimum: 1
          description: Referencia a `UNIDADES_TRANSPORTE`.
        FECHA_CIERRE:
          type: string
          format: date-time
          nullable: true
          description: Nulo mientras la expedición está abierta. Debe ser posterior o igual a `CREADO_EN`.
        ID_UBICACION_SALIDA:
          type: integer
          nullable: true
          minimum: 1
          description: Identificador externo de la ubicación de salida.
        UBICACION_SALIDA_ID:
          type: integer
          nullable: true
          minimum: 1
          description: Referencia a `UBICACIONES`. Nulo si la expedición no indica ubicación de salida.
        USUARIO_ID:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Identificador del usuario. Con origen `1` apunta a `USUARIOS`.
            Con otro origen es una referencia externa.
        ID_ORIGEN_USUARIO:
          type: integer
          nullable: true
          minimum: 1
          description: Procedencia de `USUARIO_ID`. El valor `1` es interno.
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento en que se creó el registro. Lo asigna el servicio.
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento de la última modificación. Lo mueve el servicio en cada cambio.
    ExpedicionEntrada:
      type: object
      required: [ID_UNIDAD]
      properties:
        ID_UNIDAD:
          type: integer
          minimum: 1
        FECHA_CIERRE:
          type: string
          format: date-time
          nullable: true
        ID_UBICACION_SALIDA:
          type: integer
          nullable: true
          minimum: 1
        UBICACION_SALIDA_ID:
          type: integer
          nullable: true
          minimum: 1
        USUARIO_ID:
          type: integer
          nullable: true
          minimum: 1
        ID_ORIGEN_USUARIO:
          type: integer
          nullable: true
          minimum: 1
      description: |
        En el reemplazo, los opcionales omitidos se guardan como `null`.
        `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
    ExpedicionLote:
      type: object
      required:
        - ID
        - ID_EXPEDICION
        - ID_LOTE
        - EMBARCADO_EN
        - USUARIO_ID
        - ID_ORIGEN_USUARIO
        - CREADO_EN
        - ACTUALIZADO_EN
      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
        ID_EXPEDICION:
          type: integer
          minimum: 1
          description: Referencia a `EXPEDICIONES`.
        ID_LOTE:
          type: integer
          minimum: 1
          description: Referencia a `LOTES`. Debe ser suelto y no estar embarcado.
        EMBARCADO_EN:
          type: string
          format: date-time
          description: Momento del embarque. Por defecto `now()`.
        USUARIO_ID:
          type: integer
          nullable: true
          minimum: 1
        ID_ORIGEN_USUARIO:
          type: integer
          nullable: true
          minimum: 1
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
    ExpedicionLoteEntrada:
      type: object
      required: [ID_EXPEDICION, ID_LOTE]
      properties:
        ID_EXPEDICION:
          type: integer
          minimum: 1
        ID_LOTE:
          type: integer
          minimum: 1
        EMBARCADO_EN:
          type: string
          format: date-time
          nullable: true
        USUARIO_ID:
          type: integer
          nullable: true
          minimum: 1
        ID_ORIGEN_USUARIO:
          type: integer
          nullable: true
          minimum: 1
      description: |
        `EMBARCADO_EN` omitido o `null` usa el valor por defecto de la base.
        `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
    ExpedicionCarga:
      type: object
      required: [EXPEDICION, RESUMEN, LOTES]
      properties:
        EXPEDICION:
          $ref: '#/components/schemas/Expedicion'
        RESUMEN:
          type: object
          required: [LOTES, PRODUCTOS, POR_TIPO]
          properties:
            LOTES:
              type: integer
              minimum: 0
              description: Cantidad de lotes en la carga (raíces embarcadas y sus hijos).
            PRODUCTOS:
              type: integer
              minimum: 0
              description: Cantidad de filas de producto en esos lotes.
            POR_TIPO:
              type: array
              description: Desglose de lotes y productos por tipo de lote.
              items:
                type: object
                required: [ID_TIPO, CODIGO, NOMBRE, ES_FINAL, LOTES, PRODUCTOS]
                properties:
                  ID_TIPO:
                    type: integer
                    minimum: 1
                  CODIGO:
                    type: string
                  NOMBRE:
                    type: string
                  ES_FINAL:
                    type: boolean
                  LOTES:
                    type: integer
                    minimum: 0
                  PRODUCTOS:
                    type: integer
                    minimum: 0
        LOTES:
          type: array
          items:
            $ref: '#/components/schemas/ExpedicionCargaLote'
    ExpedicionCargaLote:
      type: object
      required:
        - ID
        - ID_TIPO
        - PADRE_ID
        - EMBARCADO_DIRECTO
        - TIPO
        - REFERENCIAS
        - PRODUCTOS
      properties:
        ID:
          type: integer
          minimum: 1
        ID_TIPO:
          type: integer
          minimum: 1
        PADRE_ID:
