      description: |
        Reemplaza `ID_LOTE`, `CLAVE_PRODUCTO`, `CANTIDAD` e `ID_UNIDAD`.
        `CLAVE_PRODUCTO` es obligatoria y se recortan los espacios.
      requestBody:
        $ref: '#/components/requestBodies/LoteProducto'
      responses:
        '200':
          description: Producto actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLoteProducto'
        '400':
          $ref: '#/components/responses/ErrorLoteProducto'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    delete:
      tags: [Productos de lote]
      operationId: deleteLoteProducto
      summary: Elimina un producto de lote
      responses:
        '200':
          $ref: '#/components/responses/Eliminado'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /lotes:
    get:
      tags: [Lotes]
      operationId: listLotes
      summary: Lista los lotes
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Items'
        - $ref: '#/components/parameters/PadreId'
        - $ref: '#/components/parameters/IdTipo'
        - $ref: '#/components/parameters/IdUnidad'
        - $ref: '#/components/parameters/EsFinal'
        - $ref: '#/components/parameters/Embarcable'
      responses:
        '200':
          description: |
            Lotes ordenados por `CREADO_EN` descendente.
            Acepta `padre_id`, `id_tipo`, `id_unidad`, `es_final` y `embarcable`.
            `embarcable=true` deja solo lotes sin padre y no embarcados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLoteLista'
        '400':
          description: |
            Paginación inválida o filtro inválido
            (`padre_id`, `id_tipo`, `id_unidad`, `es_final`, `embarcable`).
            `error.error` puede ser el de la paginación o `invalid_padre_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [Lotes]
      operationId: createLote
      summary: Crea un lote
      requestBody:
        $ref: '#/components/requestBodies/Lote'
      responses:
        '201':
          description: Lote creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLote'
        '400':
          $ref: '#/components/responses/ErrorLote'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /lotes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
