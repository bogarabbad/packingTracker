              $ref: '#/components/schemas/MetadataPaginacion'
    RespuestaVacia:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              nullable: true
            error:
              nullable: true
    RespuestaError:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              nullable: true
            error:
              $ref: '#/components/schemas/Error'
    Health:
      type: object
      required: [status, service, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          example: packing-tracker
        checks:
          type: object
          required: [api, database]
          properties:
            api:
              $ref: '#/components/schemas/Check'
            database:
              $ref: '#/components/schemas/Check'
    Check:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: "`ok` cuando el chequeo pasa. En la base, `error` cuando la conexión falla."
          enum: [ok, error]
    Catalogo:
      type: object
      required: [ID, CODIGO, NOMBRE, ACTIVO, ES_SEMILLA, CREADO_EN, ACTUALIZADO_EN]
      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
        CODIGO:
          type: string
          minLength: 1
        NOMBRE:
          type: string
          minLength: 1
        ACTIVO:
          type: boolean
        ES_SEMILLA:
          type: boolean
          readOnly: true
          description: |
            `true` si el registro nació en `init.sql` o `seed.sql`.
            Ese registro se puede modificar y no se puede eliminar.
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento en que se creó el registro. Lo asigna el servicio.
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento de la última modificación. Lo mueve el servicio en cada cambio.
    UnidadMedida:
      type: object
      required: [ID, CODIGO, NOMBRE, ACTIVO, ES_SEMILLA, ENTERA, CREADO_EN, ACTUALIZADO_EN]
      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
        CODIGO:
          type: string
          minLength: 1
        NOMBRE:
          type: string
          minLength: 1
        ACTIVO:
          type: boolean
        ES_SEMILLA:
          type: boolean
          readOnly: true
          description: Unidad, litro y kilo nacen como semilla. Se pueden modificar y no se eliminan.
        ENTERA:
          type: boolean
          description: |
            `true` cuando la cantidad del producto debe ser entera, como en la unidad.
            `false` en litro y kilo.
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento en que se creó el registro. Lo asigna el servicio.
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento de la última modificación. Lo mueve el servicio en cada cambio.
    LoteTipoUnidad:
      type: object
      required: [ID, ID_TIPO, ID_UNIDAD, ES_SEMILLA, CREADO_EN, ACTUALIZADO_EN]
      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
        ID_TIPO:
          type: integer
          minimum: 1
          description: Referencia a un `LOTES_TIPOS` final.
        ID_UNIDAD:
          type: integer
          minimum: 1
          description: Referencia a `UNIDADES`.
        ES_SEMILLA:
          type: boolean
          readOnly: true
          description: |
            `true` en las relaciones que nacen con caja y tambo.
            Se pueden modificar y no se eliminan.
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento en que se creó el registro. Lo asigna el servicio.
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento de la última modificación. Lo mueve el servicio en cada cambio.
    LoteTipoUnidadEntrada:
      type: object
      required: [ID_TIPO, ID_UNIDAD]
      properties:
        ID_TIPO:
          type: integer
          minimum: 1
        ID_UNIDAD:
          type: integer
          minimum: 1
      description: |
        `ES_SEMILLA`, `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
        El tipo de lote tiene que ser final.
    Lote:
      type: object
      required: [ID, ID_TIPO, PADRE_ID, ID_UNIDAD, USUARIO_ID, CREADO_EN, ACTUALIZADO_EN]

      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
        ID_TIPO:
          type: integer
          minimum: 1
          description: Referencia a `LOTES_TIPOS`.
        PADRE_ID:
          type: integer
          nullable: true
          minimum: 1
          description: Lote que lo contiene. Solo una categoría final puede tener padre, y ese padre no es final.
        ID_UNIDAD:
          type: integer
          nullable: true
          minimum: 1
          description: Unidad de transporte. Solo la puede llevar una categoría que no es final.
        USUARIO_ID:
          type: integer
          nullable: true
          minimum: 1
          description: Usuario externo que registra el lote. No referencia una tabla de esta base.
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento en que se creó el registro. Lo asigna el servicio.
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento de la última modificación. Lo mueve el servicio en cada cambio.
    LoteEntrada:
      type: object
      required: [ID_TIPO]
      properties:
        ID_TIPO:
          type: integer
          minimum: 1
        PADRE_ID:
          type: integer
          nullable: true
          minimum: 1
        ID_UNIDAD:
          type: integer
          nullable: true
          minimum: 1
        USUARIO_ID:
          type: integer
          nullable: true
          minimum: 1
          description: Usuario externo que registra el lote. No referencia una tabla de esta base.
      description: |
        En el reemplazo, `PADRE_ID`, `ID_UNIDAD` y `USUARIO_ID` omitidos se guardan como `null`.
        `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
    LoteReferencia:
      type: object
      required: [ID, ID_LOTE, ID_TIPO, REFERENCIA, USUARIO_ID, CREADO_EN, ACTUALIZADO_EN]
      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
        ID_LOTE:
          type: integer
          minimum: 1
          description: Referencia a `LOTES`.
        ID_TIPO:
          type: integer
          minimum: 1
          description: Referencia a `REFERENCIAS_TIPOS`.
        REFERENCIA:
          type: string
          minLength: 1
          description: Identificador externo. Se recortan los espacios.
        USUARIO_ID:
          type: integer
          nullable: true
          minimum: 1
          description: Usuario externo que registra la referencia. No referencia una tabla de esta base.
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento en que se creó el registro. Lo asigna el servicio.
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento de la última modificación. Lo mueve el servicio en cada cambio.
    LoteReferenciaEntrada:
      type: object
      required: [ID_LOTE, ID_TIPO, REFERENCIA]
      properties:
        ID_LOTE:
          type: integer
          minimum: 1
        ID_TIPO:
          type: integer
          minimum: 1
        REFERENCIA:
          type: string
          minLength: 1
        USUARIO_ID:
          type: integer
          nullable: true
          minimum: 1
      description: |
        En el reemplazo, `USUARIO_ID` omitido se guarda como `null`.
        `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
    LoteTipo:
      type: object
      required: [ID, CODIGO, NOMBRE, ACTIVO, ES_SEMILLA, ES_FINAL, CREADO_EN, ACTUALIZADO_EN]
      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
        CODIGO:
          type: string
          minLength: 1
        NOMBRE:
          type: string
          minLength: 1
        ACTIVO:
          type: boolean
        ES_SEMILLA:
          type: boolean
          readOnly: true
          description: Caja, tambo y tarima nacen como semilla. Se pueden modificar y no se eliminan.
        ES_FINAL:
          type: boolean
          description: |
            `true` en caja y tambo, que contienen productos.
            `false` en tarima, que contiene lotes finales.
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento en que se creó el registro. Lo asigna el servicio.
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
          description: Momento de la última modificación. Lo mueve el servicio en cada cambio.
    LoteTipoEntrada:
      type: object
      required: [CODIGO, NOMBRE]
      properties:
        CODIGO:
          type: string
          minLength: 1
        NOMBRE:
          type: string
          minLength: 1
        ACTIVO:
          type: boolean
          default: true
        ES_FINAL:
          type: boolean
          default: false
      description: |
        `ES_SEMILLA`, `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
        Las unidades de medida de un tipo viven en `LOTES_TIPOS_UNIDADES`, no en este cuerpo.
    UnidadMedidaEntrada:
      type: object
      required: [CODIGO, NOMBRE]
      properties:
        CODIGO:
          type: string
          minLength: 1
          description: Se recortan los espacios. El valor resultante debe ser único.
        NOMBRE:
          type: string
          minLength: 1
          description: Se recortan los espacios.
        ACTIVO:
          type: boolean
          default: true
          description: Si se omite, el servicio guarda `true`.
        ENTERA:
          type: boolean
          default: false
          description: En el alta, si se omite, el servicio guarda `false`. En el reemplazo, si se omite, se conserva.
      description: '`ES_SEMILLA`, `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.'
    CatalogoEntrada:
      type: object
      required: [CODIGO, NOMBRE]
      properties:
        CODIGO:
          type: string
          minLength: 1
          description: Se recortan los espacios. El valor resultante debe ser único en el catálogo.
        NOMBRE:
          type: string
          minLength: 1
          description: Se recortan los espacios.
        ACTIVO:
          type: boolean
          default: true
          description: Si se omite, el servicio guarda `true`.
      description: |
        Los campos ajenos a este esquema se ignoran.
        `CREADO_EN` y `ACTUALIZADO_EN` los asigna el servicio.
    UnidadTransporte:
      type: object
      required:
        - ID
        - CODIGO
        - ID_TIPO
        - PLACAS
        - NUMERO_ECONOMICO
        - MARCA
        - MODELO
        - ANIO
        - NUMERO_SERIE
        - CAPACIDAD_CARGA_KG
        - CAPACIDAD_VOLUMEN_M3
        - ID_ESTATUS
        - ACTIVO
        - ES_SEMILLA
        - CREADO_EN
        - ACTUALIZADO_EN
      properties:
        ID:
          type: integer
          minimum: 1
          readOnly: true
        CODIGO:
          type: string
          minLength: 1
        ID_TIPO:
          type: integer
          minimum: 1
          description: Referencia a `UNIDADES_TIPOS`.
        PLACAS:
          type: string
          minLength: 1
        NUMERO_ECONOMICO:
          type: string
          nullable: true
          minLength: 1
        MARCA:
          type: string
          nullable: true
          minLength: 1
        MODELO:
          type: string
          nullable: true
          minLength: 1
        ANIO:
          type: integer
          nullable: true
          minimum: 1980
          maximum: 2100
        NUMERO_SERIE:
          type: string
          nullable: true
          minLength: 1
        CAPACIDAD_CARGA_KG:
          type: number
          nullable: true
          minimum: 0
          description: La base la guarda como `numeric(12,2)`.
        CAPACIDAD_VOLUMEN_M3:
          type: number
          nullable: true
          minimum: 0
          description: La base la guarda como `numeric(12,2)`.
        ID_ESTATUS:
          type: integer
          minimum: 1
          description: Referencia a `UNIDADES_ESTATUS`.
        ACTIVO:
          type: boolean
        ES_SEMILLA:
          type: boolean
          readOnly: true
          description: |
            `true` si el registro nació en `seed.sql`.
            Ese registro se puede modificar y no se puede eliminar.
        CREADO_EN:
          type: string
          format: date-time
          readOnly: true
        ACTUALIZADO_EN:
          type: string
          format: date-time
          readOnly: true
    UnidadTransporteEntrada:
      type: object
      required: [CODIGO, ID_TIPO, PLACAS, ID_ESTATUS]
      properties:
        CODIGO:
          type: string
          minLength: 1
          description: Se recortan los espacios. El valor resultante debe ser único.
        ID_TIPO:
          type: integer
          minimum: 1
        PLACAS:
          type: string
          minLength: 1
          description: Se recortan los espacios. El valor resultante debe ser único.
        NUMERO_ECONOMICO:
          type: string
          nullable: true
          minLength: 1
        MARCA:
          type: string
          nullable: true
          minLength: 1
        MODELO:
          type: string
          nullable: true
          minLength: 1
        ANIO:
          type: integer
          nullable: true
          minimum: 1980
          maximum: 2100
        NUMERO_SERIE:
          type: string
          nullable: true
          minLength: 1
        CAPACIDAD_CARGA_KG:
          type: number
          nullable: true
          minimum: 0
          maximum: 9999999999.99
        CAPACIDAD_VOLUMEN_M3:
          type: number
          nullable: true
          minimum: 0
          maximum: 9999999999.99
        ID_ESTATUS:
          type: integer
          minimum: 1
        ACTIVO:
          type: boolean
          default: true
          description: Si se omite, el servicio guarda `true`.
      description: |
        `ES_SEMILLA`, `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
        En el reemplazo, cada campo opcional omitido se guarda como `null`.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        path:
          type: string
          description: Presente solo cuando la ruta no existe.
