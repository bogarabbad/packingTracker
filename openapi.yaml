          $ref: '#/components/responses/IdInvalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      tags: [Referencias de lote]
      operationId: updateLoteReferencia
      summary: Reemplaza una referencia de lote
      description: |
        Reemplaza `ID_LOTE`, `ID_TIPO`, `REFERENCIA` y `USUARIO_ID`.
        Si `USUARIO_ID` no viene, se guarda como `null`.
        `REFERENCIA` se recorta. El valor resultante no puede quedar vacío.
      requestBody:
        $ref: '#/components/requestBodies/LoteReferencia'
      responses:
        '200':
          description: Referencia actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLoteReferencia'
        '400':
          $ref: '#/components/responses/ErrorLoteReferencia'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    delete:
      tags: [Referencias de lote]
      operationId: deleteLoteReferencia
      summary: Elimina una referencia de lote
      responses:
        '200':
          $ref: '#/components/responses/Eliminado'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /lotes:
    get:
      tags: [Lotes]
      operationId: listLotes
      summary: Lista los lotes
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Items'
      responses:
        '200':
          description: Lotes ordenados por `ID`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLoteLista'
        '400':
          $ref: '#/components/responses/PaginacionInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [Lotes]
      operationId: createLote
      summary: Crea un lote
      requestBody:
        $ref: '#/components/requestBodies/Lote'
      responses:
        '201':
          description: Lote creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLote'
        '400':
          $ref: '#/components/responses/ErrorLote'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /lotes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Lotes]
      operationId: getLote
      summary: Obtiene un lote
      responses:
        '200':
          description: Lote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLote'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      tags: [Lotes]
      operationId: updateLote
      summary: Reemplaza un lote
      description: |
        Reemplaza `ID_TIPO`, `PADRE_ID`, `ID_UNIDAD` y `USUARIO_ID`.
        Si `PADRE_ID`, `ID_UNIDAD` o `USUARIO_ID` no vienen, se guardan como `null`.
        Una categoría final no lleva unidad de transporte y solo puede colgar de una categoría que no es final.
        Una categoría que no es final no tiene padre.
      requestBody:
        $ref: '#/components/requestBodies/Lote'
      responses:
        '200':
          description: Lote actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLote'
        '400':
          $ref: '#/components/responses/ErrorLote'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    delete:
      tags: [Lotes]
      operationId: deleteLote
      summary: Elimina un lote
      description: |
        También elimina los productos y las referencias de ese lote.
        Responde `409` si otro lote lo tiene como padre o si está embarcado en una expedición.
      responses:
        '200':
          $ref: '#/components/responses/Eliminado'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/LoteEnUso'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /unidades-medida:
    get:
      tags: [Unidades de medida]
      operationId: listUnidadesMedida
      summary: Lista las unidades de medida
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Items'
      responses:
        '200':
          description: Catálogo ordenado por `ID`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaUnidadMedidaLista'
        '400':
          $ref: '#/components/responses/PaginacionInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [Unidades de medida]
      operationId: createUnidadMedida
      summary: Crea una unidad de medida
      requestBody:
        $ref: '#/components/requestBodies/UnidadMedida'
      responses:
        '201':
          description: Unidad de medida creada. `ES_SEMILLA` queda en `false`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaUnidadMedida'
        '400':
          $ref: '#/components/responses/ErrorUnidadMedida'
        '409':
          $ref: '#/components/responses/CodigoDuplicado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /unidades-medida/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Unidades de medida]
      operationId: getUnidadMedida
      summary: Obtiene una unidad de medida
      responses:
        '200':
          description: Unidad de medida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaUnidadMedida'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      tags: [Unidades de medida]
      operationId: updateUnidadMedida
      summary: Reemplaza una unidad de medida
      description: |
        Reemplaza `CODIGO` y `NOMBRE`. Si `ACTIVO` no viene, se guarda `true`.
        Si `ENTERA` no viene, se conserva el valor actual.
        No se puede marcar `ENTERA` cuando ya hay productos con cantidad fraccionaria en esa unidad.
      requestBody:
        $ref: '#/components/requestBodies/UnidadMedida'
      responses:
        '200':
          description: Unidad de medida actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaUnidadMedida'
        '400':
          $ref: '#/components/responses/ErrorUnidadMedida'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/CodigoDuplicado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    delete:
      tags: [Unidades de medida]
      operationId: deleteUnidadMedida
      summary: Elimina una unidad de medida
      responses:
        '200':
          $ref: '#/components/responses/Eliminado'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoEliminacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /unidades-transporte:
    get:
      tags: [Unidades de transporte]
      operationId: listUnidadesTransporte
      summary: Lista las unidades de transporte
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Items'
      responses:
        '200':
          description: Unidades ordenadas por `ID`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaUnidadTransporteLista'
        '400':
          $ref: '#/components/responses/PaginacionInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [Unidades de transporte]
      operationId: createUnidadTransporte
      summary: Crea una unidad de transporte
      requestBody:
        $ref: '#/components/requestBodies/UnidadTransporte'
      responses:
        '201':
          description: Unidad creada. El `ID` lo asigna la base de datos y `ES_SEMILLA` queda en `false`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaUnidadTransporte'
        '400':
          $ref: '#/components/responses/ErrorUnidad'
        '409':
          $ref: '#/components/responses/UnidadDuplicada'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /unidades-transporte/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Unidades de transporte]
      operationId: getUnidadTransporte
      summary: Obtiene una unidad de transporte
      responses:
        '200':
          description: Unidad de transporte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaUnidadTransporte'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      tags: [Unidades de transporte]
      operationId: updateUnidadTransporte
      summary: Reemplaza una unidad de transporte
      description: |
        Reemplaza los datos editables. Si `ACTIVO` no viene, se guarda `true`.
        Si un dato opcional no viene, se guarda `null`.
        `ES_SEMILLA` y `CREADO_EN` no cambian. `ACTUALIZADO_EN` pasa a ser el momento del reemplazo.
      requestBody:
        $ref: '#/components/requestBodies/UnidadTransporte'
      responses:
        '200':
          description: Unidad actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaUnidadTransporte'
        '400':
          $ref: '#/components/responses/ErrorUnidad'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/UnidadDuplicada'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    delete:
      tags: [Unidades de transporte]
      operationId: deleteUnidadTransporte
      summary: Elimina una unidad de transporte
      responses:
        '200':
          $ref: '#/components/responses/Eliminado'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoEliminacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador entero positivo, sin ceros a la izquierda.
      schema:
        type: string
        pattern: '^[1-9]\d*$'
    Page:
      name: page
      in: query
      required: false
      description: Página, empezando en 1. Si se omite, el servicio usa 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Items:
      name: items
      in: query
      required: false
      description: Registros por página. Si se omite, el servicio usa 50.
      schema:
        type: integer
        minimum: 1
        default: 50
  requestBodies:
    LoteTipo:
      required: true
      description: |
        En el alta, `ES_FINAL` omitido se guarda como `false`.
        En el reemplazo, `ES_FINAL` omitido conserva su valor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoteTipoEntrada'
          example:
            CODIGO: tambo
            NOMBRE: Tambo
            ACTIVO: true
            ES_FINAL: true
    UnidadMedida:
      required: true
      description: |
        En el alta, `ENTERA` omitido se guarda como `false`.
        En el reemplazo, `ENTERA` omitido conserva su valor.
        `ES_SEMILLA`, `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnidadMedidaEntrada'
          example:
            CODIGO: gramo
            NOMBRE: Gramo
            ACTIVO: true
            ENTERA: false
    LoteTipoUnidad:
      required: true
      description: '`ES_SEMILLA`, `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoteTipoUnidadEntrada'
          example:
            ID_TIPO: 1
            ID_UNIDAD: 1
    Lote:
      required: true
      description: |
        `PADRE_ID`, `ID_UNIDAD` y `USUARIO_ID` se pueden omitir. El servicio los guarda como `null`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoteEntrada'
          example:
            ID_TIPO: 1
            PADRE_ID: null
            ID_UNIDAD: null
            USUARIO_ID: null
    LoteReferencia:
      required: true
      description: |
        `USUARIO_ID` se puede omitir. El servicio lo guarda como `null`.
        `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoteReferenciaEntrada'
          example:
            ID_LOTE: 1
            ID_TIPO: 1
            REFERENCIA: PL-100
            USUARIO_ID: 10
    Catalogo:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CatalogoEntrada'
          example:
            CODIGO: disponible
            NOMBRE: Disponible
            ACTIVO: true
    UnidadTransporte:
      required: true
      description: |
        `ES_SEMILLA`, `CREADO_EN` y `ACTUALIZADO_EN` se ignoran.
        Un texto opcional vacío no es válido. Omitirlo guarda `null`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnidadTransporteEntrada'
          example:
            CODIGO: UT-010
            ID_TIPO: 1
            PLACAS: 84AB3C9
            NUMERO_ECONOMICO: ECO-10
            MARCA: Kenworth
            MODELO: T680
            ANIO: 2024
            NUMERO_SERIE: 1XKYDP9X5NJ123010
            CAPACIDAD_CARGA_KG: 20000
            CAPACIDAD_VOLUMEN_M3: 80
            ID_ESTATUS: 1
            ACTIVO: true
  responses:
    CatalogoLista:
      description: Catálogo ordenado por `ID`, recortado a la página pedida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaCatalogoLista'
    PaginacionInvalida:
      description: |
        `page` o `items` no es un entero positivo.
        `error.error` puede ser `invalid_page` o `invalid_items`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            page:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_page
            items:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_items
    Catalogo:
      description: Registro del catálogo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaCatalogo'
    CatalogoCreado:
      description: Registro creado. El `ID` lo asigna la base de datos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaCatalogo'
    Eliminado:
      description: Registro eliminado. `data` y `error` son `null`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaVacia'
          example:
            data: null
            _metadata: {}
            error: null
    IdInvalido:
      description: El identificador no es un entero positivo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          example:
            data: null
            _metadata: {}
            error:
              error: invalid_id
    NoEncontrado:
      description: No existe un registro con ese identificador.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          example:
            data: null
            _metadata: {}
            error:
              error: not_found
    ErrorSolicitud:
      description: |
        El cuerpo no es válido. `error.error` puede ser `invalid_body`, `invalid_codigo`,
        `invalid_nombre`, `invalid_activo` o `request_error` cuando el JSON no se puede leer.
        `CODIGO` y `NOMBRE` deben ser texto no vacío después de recortar espacios.
        `ACTIVO`, si se envía, debe ser booleano.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            codigo:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_codigo
            nombre:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_nombre
            activo:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_activo
            cuerpo:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_body
    CodigoDuplicado:
      description: Ya existe un registro con el mismo `CODIGO`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          example:
            data: null
            _metadata: {}
            error:
              error: duplicate_codigo
    ConflictoEliminacion:
      description: |
        `seed_not_deletable` cuando el registro es semilla: se puede modificar, no eliminar.
        `record_in_use` cuando otra fila todavía referencia el registro.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            semilla:
              value:
                data: null
                _metadata: {}
                error:
                  error: seed_not_deletable
            en_uso:
              value:
                data: null
                _metadata: {}
                error:
                  error: record_in_use
    ErrorLoteTipo:
      description: |
        El cuerpo no es válido o el cambio de `ES_FINAL` deja el tipo inconsistente
        con sus lotes, productos o unidades de medida.
        `invalid_es_final` cuando `ES_FINAL` no es booleano.
        `invalid_tipo_lote` cuando la base rechaza el cambio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            final:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_es_final
            tipo:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_tipo_lote
    ErrorLoteReferencia:
      description: |
        El cuerpo no es válido, el lote o el tipo no existen, o la referencia queda vacía.
        `error.error` puede ser `invalid_body`, `invalid_id_lote`, `invalid_id_tipo`,
        `invalid_referencia` o `invalid_usuario_id`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            lote:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_id_lote
            referencia:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_referencia
    ErrorLote:
      description: |
        El cuerpo no cumple la jerarquía del lote.
        `error.error` puede ser `invalid_body`, `invalid_id_tipo`, `invalid_padre_id`,
        `invalid_id_unidad`, `invalid_usuario_id`, `invalid_tipo_lote` o `invalid_lote`.
        `invalid_id_unidad` también responde cuando una categoría final trae unidad de transporte
        o cuando esa unidad no existe.
        `invalid_lote` responde cuando una categoría final intenta contener otro lote.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            padre:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_padre_id
            unidad:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_id_unidad
            usuario:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_usuario_id
    LoteEnUso:
      description: Otro lote lo tiene como padre o el lote está embarcado en una expedición.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          example:
            data: null
            _metadata: {}
            error:
              error: record_in_use
    ErrorRelacionLote:
      description: |
        El cuerpo no es válido, el tipo o la unidad no existen, o el tipo no es final.
        `error.error` puede ser `invalid_body`, `invalid_id_tipo`, `invalid_id_unidad` o `invalid_tipo_lote`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            tipo:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_tipo_lote
            unidad:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_id_unidad
    RelacionDuplicada:
      description: Ese tipo de lote ya tiene relacionada esa unidad de medida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          example:
            data: null
            _metadata: {}
            error:
              error: duplicate_relacion
    RelacionEnUso:
      description: |
        `duplicate_relacion` cuando el tipo ya tiene esa unidad.
        `record_in_use` cuando el par que se reemplaza todavía mide productos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            duplicada:
              value:
                data: null
                _metadata: {}
                error:
                  error: duplicate_relacion
            en_uso:
              value:
                data: null
                _metadata: {}
                error:
                  error: record_in_use
    ErrorUnidadMedida:
      description: |
        El cuerpo no es válido o el cambio de `ENTERA` deja cantidades fraccionarias en productos de esa unidad.
        `error.error` puede ser `invalid_body`, `invalid_codigo`, `invalid_nombre`, `invalid_activo` o `invalid_entera`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            entera:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_entera
            codigo:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_codigo
    ErrorUnidad:
      description: |
        El cuerpo no es válido o el tipo, el estatus o un límite de la unidad no se cumplen.
        `invalid_id_tipo` e `invalid_id_estatus` también responden cuando ese catálogo no existe.
        `invalid_anio` cuando el año no está entre 1980 y 2100.
        Las capacidades, si vienen, son números mayores o iguales a cero y de hasta `9999999999.99`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            placas:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_placas
            tipo:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_id_tipo
            anio:
              value:
                data: null
                _metadata: {}
                error:
                  error: invalid_anio
    UnidadDuplicada:
      description: |
        Ya existe otra unidad con el mismo valor.
        `error.error` puede ser `duplicate_codigo`, `duplicate_placas`,
        `duplicate_numero_economico` o `duplicate_numero_serie`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            codigo:
              value:
                data: null
                _metadata: {}
                error:
                  error: duplicate_codigo
            placas:
              value:
                data: null
                _metadata: {}
                error:
                  error: duplicate_placas
    ErrorInterno:
      description: Fallo no controlado del servicio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          example:
            data: null
            _metadata: {}
            error:
              error: internal_error
  schemas:
    Metadata:
      description: |
        Vacío cuando la respuesta no es una lista.
        En un GET de lista contiene la paginación aplicada.
      oneOf:
        - $ref: '#/components/schemas/MetadataVacia'
        - $ref: '#/components/schemas/MetadataPaginacion'
    MetadataVacia:
      type: object
      additionalProperties: false
    MetadataPaginacion:
      type: object
      additionalProperties: false
      required: [page, items, total, pages]
      properties:
        page:
          type: integer
          minimum: 1
          description: Página devuelta. El valor por defecto es 1.
        items:
          type: integer
          minimum: 1
          description: Registros pedidos por página. El valor por defecto es 50.
        total:
          type: integer
          minimum: 0
          description: Registros de la consulta, sin recortar por página.
        pages:
          type: integer
          minimum: 0
          description: Páginas que cubren `total` con el `items` usado. Cero cuando no hay registros.
    Sobre:
      type: object
      required: [data, _metadata, error]
      properties:
        data:
          nullable: true
          description: |
            Objeto o lista con el resultado.
            `null` cuando la respuesta es un error o una eliminación.
        _metadata:
          $ref: '#/components/schemas/Metadata'
        error:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Error'
          description: "`null` cuando la petición tiene éxito."
    RespuestaHealth:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Health'
    RespuestaCatalogo:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Catalogo'
    RespuestaCatalogoLista:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Catalogo'
            _metadata:
              $ref: '#/components/schemas/MetadataPaginacion'
    RespuestaLoteTipo:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LoteTipo'
    RespuestaLote:
      allOf:
        - $ref: '#/components/schemas/Sobre'
