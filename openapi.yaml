openapi: 3.0.3
info:
  title: packingTracker
  version: 0.1.0
  license:
    name: GPL-3.0-only
    url: https://www.gnu.org/licenses/gpl-3.0.html
  description: |
    API para la trazabilidad de la mercancía que se carga en un camión.
    El documento de carga es el packing list, identificado por folio.
    El servicio es agnóstico y otros sistemas lo consumen por HTTP.

    Esta versión publica el estado del servicio, el CRUD de los catálogos
    `UNIDADES_ESTATUS`, `UNIDADES_TIPOS`, `LOTES_TIPOS`, `UNIDADES` y `REFERENCIAS_TIPOS`,
    el CRUD de `LOTES_TIPOS_UNIDADES`, el CRUD de `LOTES`, el CRUD de `LOTES_REFERENCIAS`,
    el CRUD de `LOTES_PRODUCTOS`, el CRUD de `EXPEDICIONES`, el CRUD de
    `EXPEDICIONES_LOTES` y el CRUD de `UNIDADES_TRANSPORTE`.

    Toda respuesta usa el mismo sobre: `data`, `_metadata` y `error`.
    `data` es un objeto o una lista cuando la petición tiene éxito, y `null` en un error o una eliminación.
    `_metadata` va vacío, salvo en un GET de lista: ahí trae `page`, `items`, `total` y `pages`.
    Si la petición no envía `page` o `items`, el servicio usa `1` y `50`.
    `error` es `null` cuando la petición tiene éxito. En un fallo es un objeto con `error` y, si la ruta no existe, `path`.

    Cada registro guarda `CREADO_EN` y `ACTUALIZADO_EN`.
    El servicio escribe `CREADO_EN` al crear y mueve `ACTUALIZADO_EN` en cada modificación.
    El cliente no puede cambiar esas fechas.

    Una ruta que no existe responde `404`. El código queda en `error.error` como `not_found` y la ruta en `error.path`.

    Todas las rutas exigen un JWT Bearer, salvo `GET /health` y `POST /auth/login`.
    El login autentica contra `USUARIOS` y firma un access token HS256.
security:
  - BearerAuth: []
servers:
  - url: http://localhost:3000
    description: API publicada en el host
  - url: http://packing-tracker:3000
    description: API dentro de la red Docker packing-tracker
tags:
  - name: Salud
    description: Disponibilidad del proceso y de PostgreSQL. No exige autenticación.
  - name: Autenticación
    description: |
      Emisión de JWT para usuarios internos de `USUARIOS`.
      El cuerpo usa `CODIGO` y `CONTRASENA`.
  - name: Estatus de unidades
    description: Catálogo `UNIDADES_ESTATUS`.
  - name: Tipos de unidades
    description: Catálogo `UNIDADES_TIPOS`.
  - name: Tipos de lote
    description: |
      Catálogo `LOTES_TIPOS`. Caja y tambo son categorías finales y contienen productos.
      La tarima no es final y contiene esas categorías.
  - name: Unidades de medida
    description: |
      Catálogo `UNIDADES`.
      `ENTERA` indica que la cantidad del producto debe ser un número entero.
      Unidad, litro y kilo nacen como semilla.
  - name: Medidas de tipos de lote
    description: |
      Relación `LOTES_TIPOS_UNIDADES`.
      Indica en qué unidades de medida puede contar productos un tipo de lote final.
      La caja nace ligada a la unidad. El tambo nace ligado al litro y al kilo.
  - name: Tipos de referencia
    description: |
      Catálogo `REFERENCIAS_TIPOS`.
      Clasifica la referencia externa de un lote.
      PACKING nace como semilla.
  - name: Referencias de lote
    description: |
      Registro `LOTES_REFERENCIAS`.
      Une un lote con una referencia externa y el tipo de esa referencia.
      `USUARIO_ID` e `ID_ORIGEN_USUARIO` van juntos.
      El origen `1` es interno (`USUARIOS`). Cualquier otro origen es externo.
      El listado acepta `id_lote` para filtrar.
  - name: Productos de lote
    description: |
      Registro `LOTES_PRODUCTOS`.
      Solo un lote de categoría final puede llevar productos.
      La unidad de medida debe estar permitida para el tipo del lote.
      El producto externo se identifica solo por `CLAVE_PRODUCTO`.
      El `ID` de la fila lo asigna la base como identity.
      El listado acepta `id_lote` para filtrar.
  - name: Lotes
    description: |
      Registro `LOTES`.
      Una caja o un tambo puede ir dentro de una tarima.
      Solo la tarima puede apuntar a la unidad de transporte.
      `USUARIO_ID` e `ID_ORIGEN_USUARIO` van juntos.
      El origen `1` es interno (`USUARIOS`). Cualquier otro origen es externo.
  - name: Expediciones
    description: |
      Registro `EXPEDICIONES`.
      Una unidad de transporte solo puede tener una expedición abierta
      (`FECHA_CIERRE` nulo).
      `USUARIO_ID` e `ID_ORIGEN_USUARIO` van juntos.
      El origen `1` es interno (`USUARIOS`). Cualquier otro origen es externo.
  - name: Embarques
    description: |
      Registro `EXPEDICIONES_LOTES`.
      Relaciona un lote con una expedición.
      Solo lotes sin `PADRE_ID` (sueltos) y que aún no estén embarcados.
      Un lote solo puede pertenecer a una expedición.
      No se agrega ni se quita en una expedición cerrada.
  - name: Unidades de transporte
    description: |
      Registro `UNIDADES_TRANSPORTE`.
      `ES_SEMILLA`, `CREADO_EN` y `ACTUALIZADO_EN` los asigna el servicio.
paths:
  /health:
    get:
      tags: [Salud]
      operationId: getHealth
      summary: Estado del servicio y de la base de datos
      security: []
      responses:
        '200':
          description: La API responde y PostgreSQL acepta la conexión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaHealth'
              example:
                data:
                  status: ok
                  service: packing-tracker
                  checks:
                    api:
                      status: ok
                    database:
                      status: ok
                _metadata: {}
                error: null
        '503':
          description: La API responde, pero PostgreSQL no acepta la conexión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaHealth'
              example:
                data:
                  status: degraded
                  service: packing-tracker
                  checks:
                    api:
                      status: ok
                    database:
                      status: error
                _metadata: {}
                error: null
  /auth/login:
    post:
      tags: [Autenticación]
      operationId: login
      summary: Obtiene un access token
      security: []
      description: |
        Autentica un usuario de `USUARIOS` activo.
        Responde `401` con `invalid_credentials` si el código o la contraseña no coinciden.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginEntrada'
            example:
              CODIGO: ADMIN
              CONTRASENA: Admin123!
      responses:
        '200':
          description: Token emitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLogin'
        '400':
          description: |
            Cuerpo inválido.
            `error.error` puede ser `invalid_body`, `invalid_codigo` o `invalid_contrasena`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                data: null
                _metadata: {}
                error:
                  error: invalid_codigo
        '401':
          description: Credenciales inválidas o usuario inactivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                data: null
                _metadata: {}
                error:
                  error: invalid_credentials
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /unidades-estatus:
    get:
      tags: [Estatus de unidades]
      operationId: listUnidadesEstatus
      summary: Lista los estatus de unidad
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Items'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Activo'
      responses:
        '200':
          $ref: '#/components/responses/CatalogoLista'
        '400':
          $ref: '#/components/responses/PaginacionInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [Estatus de unidades]
      operationId: createUnidadEstatus
      summary: Crea un estatus de unidad
      requestBody:
        $ref: '#/components/requestBodies/Catalogo'
      responses:
        '201':
          $ref: '#/components/responses/CatalogoCreado'
        '400':
          $ref: '#/components/responses/ErrorSolicitud'
        '409':
          $ref: '#/components/responses/CodigoDuplicado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /unidades-estatus/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Estatus de unidades]
      operationId: getUnidadEstatus
      summary: Obtiene un estatus de unidad
      responses:
        '200':
          $ref: '#/components/responses/Catalogo'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      tags: [Estatus de unidades]
      operationId: updateUnidadEstatus
      summary: Reemplaza un estatus de unidad
      description: |
        Reemplaza `CODIGO`, `NOMBRE` y `ACTIVO`. Si `ACTIVO` no viene en el cuerpo, se guarda `true`.
      requestBody:
        $ref: '#/components/requestBodies/Catalogo'
      responses:
        '200':
          $ref: '#/components/responses/Catalogo'
        '400':
          $ref: '#/components/responses/ErrorSolicitud'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/CodigoDuplicado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    delete:
      tags: [Estatus de unidades]
      operationId: deleteUnidadEstatus
      summary: Elimina un estatus de unidad
      responses:
        '200':
          $ref: '#/components/responses/Eliminado'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoEliminacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /unidades-tipos:
    get:
      tags: [Tipos de unidades]
      operationId: listUnidadesTipos
      summary: Lista los tipos de unidad
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Items'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Activo'
      responses:
        '200':
          $ref: '#/components/responses/CatalogoLista'
        '400':
          $ref: '#/components/responses/PaginacionInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [Tipos de unidades]
      operationId: createUnidadTipo
      summary: Crea un tipo de unidad
      requestBody:
        $ref: '#/components/requestBodies/Catalogo'
      responses:
        '201':
          $ref: '#/components/responses/CatalogoCreado'
        '400':
          $ref: '#/components/responses/ErrorSolicitud'
        '409':
          $ref: '#/components/responses/CodigoDuplicado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /unidades-tipos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Tipos de unidades]
      operationId: getUnidadTipo
      summary: Obtiene un tipo de unidad
      responses:
        '200':
          $ref: '#/components/responses/Catalogo'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      tags: [Tipos de unidades]
      operationId: updateUnidadTipo
      summary: Reemplaza un tipo de unidad
      description: |
        Reemplaza `CODIGO`, `NOMBRE` y `ACTIVO`. Si `ACTIVO` no viene en el cuerpo, se guarda `true`.
      requestBody:
        $ref: '#/components/requestBodies/Catalogo'
      responses:
        '200':
          $ref: '#/components/responses/Catalogo'
        '400':
          $ref: '#/components/responses/ErrorSolicitud'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/CodigoDuplicado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    delete:
      tags: [Tipos de unidades]
      operationId: deleteUnidadTipo
      summary: Elimina un tipo de unidad
      responses:
        '200':
          $ref: '#/components/responses/Eliminado'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoEliminacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /lotes-tipos:
    get:
      tags: [Tipos de lote]
      operationId: listLotesTipos
      summary: Lista los tipos de lote
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Items'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Activo'
        - $ref: '#/components/parameters/EsFinal'
      responses:
        '200':
          description: Catálogo ordenado por `CREADO_EN` descendente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLoteTipoLista'
        '400':
          $ref: '#/components/responses/PaginacionInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [Tipos de lote]
      operationId: createLoteTipo
      summary: Crea un tipo de lote
      requestBody:
        $ref: '#/components/requestBodies/LoteTipo'
      responses:
        '201':
          description: Tipo de lote creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLoteTipo'
        '400':
          $ref: '#/components/responses/ErrorLoteTipo'
        '409':
          $ref: '#/components/responses/CodigoDuplicado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /lotes-tipos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Tipos de lote]
      operationId: getLoteTipo
      summary: Obtiene un tipo de lote
      responses:
        '200':
          description: Tipo de lote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLoteTipo'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      tags: [Tipos de lote]
      operationId: updateLoteTipo
      summary: Reemplaza un tipo de lote
      description: |
        Reemplaza `CODIGO` y `NOMBRE`. Si `ACTIVO` no viene, se guarda `true`.
        Si `ES_FINAL` no viene, se conserva el valor actual.
        Un tipo que deja de ser final no puede conservar unidades de medida relacionadas.
      requestBody:
        $ref: '#/components/requestBodies/LoteTipo'
      responses:
        '200':
          description: Tipo de lote actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLoteTipo'
        '400':
          $ref: '#/components/responses/ErrorLoteTipo'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/CodigoDuplicado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    delete:
      tags: [Tipos de lote]
      operationId: deleteLoteTipo
      summary: Elimina un tipo de lote
      responses:
        '200':
          $ref: '#/components/responses/Eliminado'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoEliminacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /lotes-tipos-unidades:
    get:
      tags: [Medidas de tipos de lote]
      operationId: listLotesTiposUnidades
      summary: Lista las unidades permitidas por tipo de lote
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Items'
        - $ref: '#/components/parameters/IdTipo'
      responses:
        '200':
          description: Relaciones ordenadas por `CREADO_EN` descendente. Si viene `id_tipo`, solo ese tipo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLoteTipoUnidadLista'
        '400':
          description: |
            Paginación inválida o `id_tipo` inválido.
            `error.error` puede ser el de la paginación o `invalid_id_tipo`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [Medidas de tipos de lote]
      operationId: createLoteTipoUnidad
      summary: Relaciona un tipo de lote con una unidad de medida
      requestBody:
        $ref: '#/components/requestBodies/LoteTipoUnidad'
      responses:
        '201':
          description: Relación creada. `ES_SEMILLA` queda en `false`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLoteTipoUnidad'
        '400':
          $ref: '#/components/responses/ErrorRelacionLote'
        '409':
          $ref: '#/components/responses/RelacionDuplicada'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /lotes-tipos-unidades/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Medidas de tipos de lote]
      operationId: getLoteTipoUnidad
      summary: Obtiene una relación entre tipo de lote y unidad
      responses:
        '200':
          description: Relación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLoteTipoUnidad'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      tags: [Medidas de tipos de lote]
      operationId: updateLoteTipoUnidad
      summary: Reemplaza una relación entre tipo de lote y unidad
      description: |
        Reemplaza `ID_TIPO` e `ID_UNIDAD`. `ES_SEMILLA` no cambia.
        El tipo tiene que ser final.
        No se puede dejar un par que todavía mide productos de ese tipo.
      requestBody:
        $ref: '#/components/requestBodies/LoteTipoUnidad'
      responses:
        '200':
          description: Relación actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLoteTipoUnidad'
        '400':
          $ref: '#/components/responses/ErrorRelacionLote'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/RelacionEnUso'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    delete:
      tags: [Medidas de tipos de lote]
      operationId: deleteLoteTipoUnidad
      summary: Elimina una relación entre tipo de lote y unidad
      responses:
        '200':
          $ref: '#/components/responses/Eliminado'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoEliminacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /referencias-tipos:
    get:
      tags: [Tipos de referencia]
      operationId: listReferenciasTipos
      summary: Lista los tipos de referencia
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Items'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Activo'
      responses:
        '200':
          $ref: '#/components/responses/CatalogoLista'
        '400':
          $ref: '#/components/responses/PaginacionInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [Tipos de referencia]
      operationId: createReferenciaTipo
      summary: Crea un tipo de referencia
      requestBody:
        $ref: '#/components/requestBodies/Catalogo'
      responses:
        '201':
          $ref: '#/components/responses/CatalogoCreado'
        '400':
          $ref: '#/components/responses/ErrorSolicitud'
        '409':
          $ref: '#/components/responses/CodigoDuplicado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /referencias-tipos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Tipos de referencia]
      operationId: getReferenciaTipo
      summary: Obtiene un tipo de referencia
      responses:
        '200':
          $ref: '#/components/responses/Catalogo'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      tags: [Tipos de referencia]
      operationId: updateReferenciaTipo
      summary: Reemplaza un tipo de referencia
      description: |
        Reemplaza `CODIGO`, `NOMBRE` y `ACTIVO`. Si `ACTIVO` no viene en el cuerpo, se guarda `true`.
      requestBody:
        $ref: '#/components/requestBodies/Catalogo'
      responses:
        '200':
          $ref: '#/components/responses/Catalogo'
        '400':
          $ref: '#/components/responses/ErrorSolicitud'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/CodigoDuplicado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    delete:
      tags: [Tipos de referencia]
      operationId: deleteReferenciaTipo
      summary: Elimina un tipo de referencia
      responses:
        '200':
          $ref: '#/components/responses/Eliminado'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoEliminacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /lotes-referencias:
    get:
      tags: [Referencias de lote]
      operationId: listLotesReferencias
      summary: Lista las referencias de lote
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Items'
        - $ref: '#/components/parameters/IdLote'
      responses:
        '200':
          description: Referencias ordenadas por `CREADO_EN` descendente. Si viene `id_lote`, solo ese lote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLoteReferenciaLista'
        '400':
          description: |
            Paginación inválida o `id_lote` inválido.
            `error.error` puede ser el de la paginación o `invalid_id_lote`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '500':
