services:
  packing-tracker:
    build: .
    image: packing-tracker:local
    container_name: packing-tracker
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: ${PGHOST:-localhost}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-packing_tracker}
      PGUSER: ${PGUSER:-packing}
      PGPASSWORD: ${PGPASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-28800}
      JWT_ISSUER: ${JWT_ISSUER:-packing-tracker}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-packing-tracker-api}
    restart: unless-stopped
    networks:
      - packing-tracker

networks:
  packing-tracker:
    name: packing-tracker
