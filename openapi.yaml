                $ref: '#/components/schemas/RespuestaLoteProducto'
        '400':
          $ref: '#/components/responses/ErrorLoteProducto'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /lotes-productos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Productos de lote]
      operationId: getLoteProducto
