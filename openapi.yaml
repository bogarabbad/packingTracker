      requestBody:
        $ref: '#/components/requestBodies/Expedicion'
      responses:
        '200':
          description: Expedición actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaExpedicion'
        '400':
          $ref: '#/components/responses/ErrorExpedicion'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/UnidadExpedicionAbierta'
